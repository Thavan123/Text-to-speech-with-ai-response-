                km: { question: "១២. របៀបធ្វើរោគវិនិច្ឆ័យរលាកស្រោមខួរលើទារក (Diagnostic méningite nourrisson) ៖", answer: "- ទារករញ៉ួរញ៉ៃ ចង់តែងងុយគេង រអ៊ូរទាំ\n- បដិសេធមិនបៅទឹកដោះគោ\n- មានការកន្ត្រាក់ដោយសារគ្រុនក្តៅ (Convulsions fébriles)\n+ ការពិនិត្យបន្ថែម៖ ពើងពុម្ពពកក្បាល (Fontanelle), ទន់ក ឬរឹងក" },
                fr: { question: "12. Comment faire du diagnostic méningite nourrisson ?", answer: "- Enfant grognon, somnolence, refus répété du biberon, convulsions fébriles.\n+ Examen : Tension de la fontanelle, hypotonie ou raideur de la nuque, signes neurologiques." },
                en: { question: "12. Diagnosing Meningitis in Infants:", answer: "- Irritability, lethargy, poor feeding, febrile seizures.\n+ Physical findings: Bulging fontanelle, nuchal rigidity/hypotonia, focal neurological signs." }
            },
            {
                id: 13, page: "46",
                km: { question: "១៣. ការពិនិត្យបញ្ជាក់ជំងឺរលាកស្រោមខួរ (Examens de confirmation) ៖", answer: "+ ការពិនិត្យទឹកឆ្អឹងខ្នង (LCR) ៖\n- សម្ពាធ LCR កើនឡើង និងបាត់បង់ភាពថ្លា\n- ចំនួនកោសិកាមិនប្រក្រតី (> 10/mm3)\n- កម្រិត Protéinorachie > 0,45 g/l\n- សមាមាត្រស្ករក្នុង LCR / ឈាម < 0,40" },
                fr: { question: "13. Examens de confirmation méningite sont :", answer: "+ Examen du LCR :\n- LCR hypertendu, perte de limpidité\n- Nombre de cellules > 10/mm3\n- Protéinorachie > 0,45 g/l\n- Rapport glucose LCR / sang < 0,40" },
                en: { question: "13. Confirmatory Tests for Meningitis:", answer: "+ CSF Examination:\n- Elevated opening pressure, cloudy appearance\n- Cell count > 10/mm3\n- Protein level > 0.45 g/L\n- CSF/Blood glucose ratio < 0.40" }
            },
            {
                id: 14, page: "46-47",
                km: { question: "១៤. រោគសញ្ញាគ្លីនិក និងមន្ទីរពិសោធន៍នៃជំងឺរលាកបំពង់ខ្យល់តូចៗ (Bronchiolite) ៖", answer: "+ ដំណាក់កាលដំបូង (ORL)៖ គ្រុនក្តៅ, ហៀរសម្រោត, ក្អកស្ងួត\n+ ដំណាក់កាលធ្ងន់ធ្ងរ៖ ក្អួត, អស់កម្លាំងមិនបៅ, កើតមានការអាក់ដង្ហើម (Apnea)\n+ ការស្តាប់សួត៖ ឮសំឡេង Sibilants និង Crépritants\n+ សញ្ញាពិបាកដកដង្ហើម៖ វាយតម្លៃតាម score de silverman" },
                fr: { question: "14. Signes cliniques et paracliniques du bronchiolite :", answer: "+ Phase débutant : Fièvre élevée, signes rhino-pharyngés, toux sèche.\n+ Phase d'état : Vomissements, apnée (<3M), cyanose, polypnée >60/min.\n+ Auscultation : Râles sibilants et sous-crépitants disséminés." },
                en: { question: "14. Clinical & Paraclinical Signs of Bronchiolitis:", answer: "+ Early phase: Fever, rhinitis, dry cough.\n+ Progressive phase: Feeding difficulty, apnea in infants <3M, severe respiratory distress.\n+ Auscultation: Wheezing (sibilant râles) and crackles." }

            {
                id: 15, page: "47-49",
                km: { question: "១៥. កត្តាហានិភ័យនៃការបង្កឱ្យកើតជំងឺហឺត (Risk factors of asthma) ៖", answer: "- អាលែហ្សែន៖ ធូលីដី, រោមសត្វ, កន្លាត, លម្អងផ្កា\n- ការឆ្លងរោគផ្លូវដង្ហើម (វីរុស)\n- ការប្រែប្រួលអារម្មណ៍ខ្លាំង ឬការហាត់ប្រាណ\n- សារធាតុគីមី និងថ្នាំ (Aspirin, Beta blocker)\n- ផ្សែងបារី និងការបំពុលបរិយាកាស" },
                fr: { question: "15. Risk factors of asthma :", answer: "- Allergen: domestic dust mites, animal fur, cockroach, pollens\n- Respiratory viral infections\n- Emotional expressions, Exercise\n- Chemical irritants & drugs (aspirin, beta blockers)\n- Tobacco smoke, Air pollution" },
                en: { question: "15. Risk Factors for Asthma:", answer: "- Allergens: Dust mites, pet dander, cockroaches, pollen\n- Viral respiratory infections\n- Exercise and strong emotional stress\n- Medications (Aspirin, Beta-blockers)\n- Tobacco smoke and air pollution" }

            {
                id: 16, page: "47-50",
                km: { question: "១៦. ការធ្វើរោគវិនិច្ឆ័យ គោលដៅ និងការគ្រប់គ្រងជំងឺហឺត (Asthma management) ៖", answer: "+ ការធ្វើរោគវិនិច្ឆ័យ៖ ប្រវត្តិរោគសញ្ញា, វាស់មុខងារសួត (Spirometry)\n+ គោលដៅ៖ គ្រប់គ្រងរោគសញ្ញា, រក្សាសកម្មភាពរាងកាយ, ការពារការរើឡើងវិញ\n+ ឱសថសំខាន់ ២ ប្រភេទ៖ Controller medications & Reliever medication\n+ ហេតុអ្វីប្រើ Inhaled medication? ព្រោះវាទៅដល់ផ្លូវដង្ហើមផ្ទាល់ និងកាត់បន្ថយផលប៉ះពាល់" },
                fr: { question: "16. What is the diagnosis / goal / management of asthma ?", answer: "+ Diagnosis: History, Spirometry, Peak expiratory flow.\n+ Goals: Control symptoms, maintain normal activities, prevent exacerbations.\
