<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pédiatrie Q&A - ឃួន ថាវ៉ាន់</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #475569;
            --accent-color: #16a34a;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 5px solid var(--primary-color);
        }

        h1 {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .author {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .lang-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .lang-btn {
            background-color: #e2e8f0;
            color: var(--text-color);
            border: none;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .q-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            background: #e0f2fe;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .q-page {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-box {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0369a1;
            line-height: 1.6;
            background: #f8fafc;
            padding: 20px;
            border-left: 6px solid var(--primary-color);
            border-radius: 8px;
            min-height: 80px;
        }

        .answer-box {
            font-size: 1.2rem;
            color: #334155;
            line-height: 1.8;
            white-space: pre-line;
            padding: 10px 5px;
            min-height: 120px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        .nav-btn {
            flex: 1;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">សំណួរ-ចម្លើយ Pédiatrie</h1>
        <div class="author" id="author-name">រៀបចំដោយ៖ ឃួន ថាវ៉ាន់</div>
        
        <div class="lang-container">
            <button class="lang-btn active" id="btn-km" onclick="setLanguage('km')">🇰🇭 ភាសាខ្មែរ</button>
            <button class="lang-btn" id="btn-fr" onclick="setLanguage('fr')">🇫🇷 Français</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">🇬🇧 English</button>
        </div>
    </header>

    <main class="container">
        <div class="card-header">
            <span class="q-number" id="q-number">សំណួរទី ១</span>
            <span class="q-page" id="q-page">ទំព័រ ៤១</span>
        </div>

        <div class="question-box" id="question-text"></div>
        <div class="answer-box" id="answer-text"></div>

        <div class="controls">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ ថយក្រោយ</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()">បន្តទៅមុខ ➡️</button>
        </div>
    </main>

    <script>
        const questionsData = [
            {
                id: 1, page: "41",
                km: { question: "១. លក្ខណៈនៃលឿងទារកដែលជាជំងឺ/មិនធម្មតា (Ictère néonatal pathologique) ៖", answer: "- ចាប់ផ្តើមស្តែងឡើងលឿន (មុន ២៤ ម៉ោងដំបូងក្រោយកើត)\n- ករណីបែកគ្រាប់ឈាមក្រហមធ្ងន់ធ្ងរ៖ មានរោគសញ្ញាស្លេកស្លាំង, ថ្លើមនិងអណ្តើករីកធំ\n- កម្រិត bilirubin libre កើនឡើងខ្លាំង\n- មានសញ្ញាស្លេកស្លាំង (Anémie normo-macrocytaire, hyper-réticulocytose)" },
                fr: { question: "1. Caractère ictère néonatal pathologique :", answer: "- Début précoce avant 24 heures de vie (le plus souvent) ;\n- En cas d'hémolyse sévère : syndrome anémique, hépatosplénomégalie ;\n- Ictère à bilirubine libre d'intensité plus forte ;\n- Anémie (normo-macrocytaire, hyper-réticulocytose)." },
                en: { question: "1. Pathological Neonatal Jaundice Characteristics:", answer: "- Early onset within first 24 hours of life\n- Severe hemolysis: anemia syndrome, hepatosplenomegaly\n- High intensity unconjugated bilirubinemia\n- Anemia (normo-macrocytic, hyper-reticulocytosis)" }
            },
            {
                id: 2, page: "41",
                km: { question: "២. រោគសញ្ញាគ្លីនិកនៃជំងឺ Trichinosis ៖", answer: "• រាករូស (Diarrhea)\n• ឈឺពោះ (Abdominal pain)\n• អស់កម្លាំង (Fatigue)\n• ចង់ក្អួត និងក្អួត (Nausea and vomiting)" },
                fr: { question: "2. Clinical manifestation of trichinosis :", answer: "• Diarrhea\n• Abdominal pain\n• Fatigue\n• Nausea and vomiting" },
                en: { question: "2. Clinical Manifestations of Trichinosis:", answer: "• Diarrhea\n• Abdominal pain\n• Fatigue\n• Nausea and vomiting" }
            },
            {
                id: 3, page: "41",
                km: { question: "៣. ការព្យាបាលជាក់លាក់លើរោគសញ្ញាតម្រងនោម Nephrotic Syndrome ៖", answer: "+ ការព្យាបាលលើកដំបូង៖ ប្រើ Prednisolone 60 mg/m2/day (ឬ 2mg/kg/day) មិនឱ្យលើស 80mg/24h រយៈពេល ៤ សប្តាហ៍\n+ ការព្យាបាលពេលលេចឡើងវិញ (Relapse > 3 ខែ ក្រោយព្យាបាលចប់)\n+ ការព្យាបាលពេលលេចឡើងវិញភ្លាមៗ (Relapse ≤ 3 ខែ)" },
                fr: { question: "3. Specific Treatment Nephrotic syndrome :", answer: "+ Treatment of initial episode of NS: Prednisolone 60 mg/m2/day (or 2mg/kg/day), not exceeded 80mg/24h, Duration: 4 weeks\n+ Treatment of relapse > 3 months after treatment completion\n+ Treatment of relapse ≤ 3 months after treatment completion" },
                en: { question: "3. Specific Treatment for Nephrotic Syndrome:", answer: "+ Initial episode: Prednisolone 60 mg/m2/day (or 2mg/kg/day), max 80mg/24h for 4 weeks\n+ Relapse > 3 months after completion\n+ Relapse ≤ 3 months after completion" }
            },
            {
                id: 4, page: "51",
                km: { question: "៤. ការធ្វើរោគវិនិច្ឆ័យជំងឺតេតាណូស (Diagnostic du tétanos) ៖", answer: "• ផ្អែកលើប្រវត្តិ ៖ ស្នាមរបួស, ប្រវត្តិផ្ទាល់ខ្លួននៃការចាក់វ៉ាក់សាំង\n• ផ្អែកលើសញ្ញាគ្លីនិក ៖ អាការៈស្ទះថ្គាមខ្លាំងមិនអាចបើកបាន (Trismus invincible), ការកញ្រ្ជោលសាច់ដុំកើនឡើងពេលមានរំញោច, ស្មារតីនៅល្អជាធម្មតា" },
                fr: { question: "4. Diagnostic du tétanos :", answer: "+ Arguments anamnestiques : Notions de la plaie, Notion de la vaccination\n+ Arguments cliniques : Trismus invincible, contracture s'accentuant lors du stimulus, conscience conservée" },
                en: { question: "4. Diagnosis of Tetanus:", answer: "+ History: Wound history, vaccination history\n+ Clinical signs: Lockjaw (trismus), severe muscle spasms with stimulation, intact consciousness" }
            },
            {
                id: 5, page: "52",
                km: { question: "៥. ការព្យាបាលជំងឺក្អកមាន់ (Traitement de la coqueluche) ៖", answer: "• សម្រាកពេទ្យសម្រាប់ទារកអាយុ < ៣ ខែ\n• ធ្វើការរៀបចំនូវការផ្តាច់ខ្លួន និងផ្អាកការសិក្សារយៈពេល ៣០ ថ្ងៃ\n• ផ្តល់អុកស៊ីសែន និងកែសម្រួលជាតិទឹកបើចាំបាច់\n• ប្រើថ្នាំ Erythromycine : 50 mg/kg/ថ្ងៃ ចែកជា ៤ ដង" },
                fr: { question: "5. Traitement de la coqueluche :", answer: "- Hospitalisation pour les nourrissons < 3 mois\n- Isolement et éviction scolaire de 30 jours\n- Oxygène et correction des troubles hydro-électrolytiques\n- Erythromycine : 50 mg/kg/j en 4 prises" },
                en: { question: "5. Treatment of Pertussis (Whooping Cough):", answer: "- Hospitalization for infants <3 months\n- Isolation and school exclusion for 30 days\n- Oxygen support and electrolyte correction\n- Erythromycin: 50 mg/kg/day divided into 4 doses" }
            }
        ];

        let currentIndex = 0;
        let currentLang = 'km';

        const uiText = {
            km: { title: "សំណួរ-ចម្លើយ Pédiatrie", author: "រៀបចំដោយ៖ ឃួន ថាវ៉ាន់", qPrefix: "សំណួរទី", pagePrefix: "ទំព័រ", prev: "⬅️ ថយក្រោយ", next: "បន្តទៅមុខ ➡️" },
            fr: { title: "Q&R Pédiatrie", author: "Préparé par : KHUON THAVAN", qPrefix: "Question n°", pagePrefix: "Page", prev: "⬅️ Précédent", next: "Suivant ➡️" },
            en: { title: "Pédiatrie Q&A", author: "Prepared by: KHUON THAVAN", qPrefix: "Question No.", pagePrefix: "Page", prev: "⬅️ Previous", next: "Next ➡️" }
        };

        function updateDisplay() {
            const currentData = questionsData[currentIndex];
            const langData = currentData[currentLang];
            const ui = uiText[currentLang];

            document.getElementById('app-title').textContent = ui.title;
            document.getElementById('author-name').textContent = ui.author;
            document.getElementById('q-number').textContent = `${ui.qPrefix} ${currentIndex + 1}`;
            document.getElementById('q-page').textContent = `${ui.pagePrefix} ${currentData.page}`;
            
            document.getElementById('question-text').textContent = langData.question;
            document.getElementById('answer-text').textContent = langData.answer;

            document.getElementById('prev-btn').textContent = ui.prev;
            document.getElementById('next-btn').textContent = ui.next;

            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === questionsData.length - 1);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-km').classList.remove('active');
            document.getElementById('btn-fr').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');

            document.getElementById(`btn-${lang}`).classList.add('active');
            updateDisplay();
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }

        // Run when page loads
        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
                </html>
