<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pédiatrie Q&A Flashcards</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Khmer & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <h1 id="app-title">សំណួរ-ចម្លើយ Pédiatrie</h1>
            <p id="author-name" class="author">រៀបចំដោយ៖ ឃួន ថាវ៉ាន់</p>
            
            <!-- Language Switcher -->
            <div class="lang-switcher">
                <button id="btn-km" class="lang-btn active" onclick="setLanguage('km')">🇰🇭 ខ្មែរ</button>
                <button id="btn-fr" class="lang-btn" onclick="setLanguage('fr')">🇫🇷 Français</button>
                <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">🇬🇧 English</button>
            </div>
        </header>

        <!-- Flashcard Body -->
        <main class="card-container">
            <div class="card-header">
                <span id="q-number" class="badge badge-primary">សំណួរទី 1 / 93</span>
                <span id="q-page" class="badge badge-secondary">ទំព័រ 78</span>
            </div>

            <div class="card-body">
                <div class="question-box">
                    <h2 id="question-text">កំពុងផ្ទុកសំណួរ...</h2>
                </div>
                <hr class="divider">
                <div class="answer-box">
                    <div id="answer-text" class="answer-content">កំពុងផ្ទុកចម្លើយ...</div>
                </div>
            </div>
        </main>

        <!-- Navigation Controls -->
        <footer class="controls">
            <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">⬅️ ថយក្រោយ</button>
            <button id="next-btn" class="nav-btn primary" onclick="nextQuestion()">បន្តទៅមុខ ➡️</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
