            { id: 4, km: "តើកត្តាអ្វីខ្លះដែលចូលរួមក្នុងការពង្រីកដងខ្លួន (សោមាតិកា) របស់ក្មេង?", fr: "Quels sont les facteurs intervenants dans le développement somatique de l’enfant?", en: "What are the factors involved in the somatic development of the child?", answer: { km: "- ការលូតលាស់ (កម្ពស់, ទម្ងន់, ផ្ទៃក្រឡាខ្លួន)\n- ការចម្រើនពេញវ័យ (អាយុធ្មេញ, អាយុឆ្អឹង, ការចម្រើនផ្នែកភេទ)", fr: "- Croissance (Taille staturale, Poids, Surface corporelle)\n- Maturation (Âge des dents, Âge osseux, Maturation sexuelle)", en: "- Growth (Height, Weight, Body surface area)\n- Maturation (Dental age, Bone age, Sexual maturation)" } },

            { id: 6, km: "តើគោលការណ៍អ្វីខ្លះដែលបណ្តាលឱ្យកើតជំងឺរលាកបំពង់ខ្យល់ Epiglottitis?", fr: "Quel est le mécanisme à l'origine de l'épiglottite?", en: "What is the mechanism causing epiglottitis?", answer: { km: "- Épiglotte រលាក និងច្រើនតែមានខ្ទុះ\n- ច្រើនកើតពីເຊື້ອ Hemophilus influenza", fr: "- Épiglotte enflammée et souvent abcédée\n- Presque toujours due à Hemophilus influenza", en: "- Inflamed and often abscessed epiglottis\n- Almost always due to Hemophilus influenza" } },
            { id: 7, km: "តើទិដ្ឋភាពគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃជំងឺគ្រុនឈាមធ្ងន់ធ្ងរ (Dengue hemorrhagic fever) មានអ្វីខ្លះ?", fr: "Quels sont les signes cliniques et paracliniques de la fièvre dengue hémorragique?", en: "What are the clinical and paraclinical signs of dengue hemorrhagic fever?", answer: { km: "- ដំណាក់កាលមានគ្រុន និងដំណាក់កាលវិបត្តិ (Critical phase)\n- ប្លាកែតធ្លាក់ចុះ (< 100 000/mm3) និងការលេចធ្លាយប្លាស្មា (Hct > 20%)", fr: "- Febrile phase et Critical phase\n- Thrombocytopenia (< 100 000/mm3) et fuite plasmatique (Hct > 20%)", en: "- Febrile phase and Critical phase\n- Thrombocytopenia (< 100 000/mm3) and plasma leakage (Hct > 20%)" } },
            { id: 8, km: "តើមធ្យោបាយធ្វើរោគវិនិច្ឆ័យជំងឺរលាកស្រោមខួរក្បាល (Meningitis) ចំពោះក្មេងមានអ្វីខ្លះ?", fr: "Quels sont les moyens de diagnostic d’une méningite chez l’enfant?", en: "What are the diagnostic methods for meningitis in children?", answer: { km: "- រោគសញ្ញាឆ្លងមេរោគ និងស្រោមខួរក្បាល\n- រឹងកញ្ចឹងក, សញ្ញា Kernig, សញ្ញា Brudzinski", fr: "- Syndrome infectieux et méningé\n- Raideur de la nuque, Signe de Kernig, Signe de Brudzinski", en: "- Infectious and meningeal syndrome\n- Stiff neck, Kernig's sign, Brudzinski's sign" } },
            { id: 9, km: "តើធាតុផ្សំនៃភាពធ្ងន់ធ្ងររបស់ជំងឺគ្រុនចាញ់ (Paludisme) មានអ្វីខ្លះ?", fr: "Quels sont les éléments de gravité du Paludisme?", en: "What are the severe elements of malaria?", answer: { km: "- Coma, convulsion, ictère\n- Hypoglycémie, Insuffisance rénale, Anémie grave", fr: "- Coma, convulsion, ictère\n- Hypoglycémie, Insuffisance rénale, Anémie grave", en: "- Coma, convulsion, jaundice\n- Hypoglycemia, Renal failure, Severe anemia" } },
            { id: 10, km: "តើយន្តការធំៗទាំងបីនៃការខ្វះឈាម (Anemia) ចំពោះទារកមានអ្វីខ្លះ?", fr: "Quels sont les trois grands mécanismes de l’anémie du nourrisson?", en: "What are the three major mechanisms of anemia in infants?", answer: { km: "- ការខ្វះការផលិតគ្រាប់ឈាមក្រហម\n- ការបំបែកកម្ទេចគ្រាប់ឈាមក្រហម (Hémolyse)\n- ការបាត់បង់ឈាម (Hémorragie)", fr: "- Défaut de production de GR\n- Hémolyse accrue\n- Hémorragie", en: "- Defect in RBC production\n- Increased hemolysis\n- Hemorrhage" } },
            { id: 11, km: "តើការខ្វះឈាមដោយសារខ្វះជាតិដែក (Anémie ferriprive) មានការវិវត្តយ៉ាងដូចម្តេច?", fr: "Quelle est l'évolution de l'anémie ferriprive?", en: "What is the evolution of iron deficiency anemia?", answer: { km: "- អស់បម្រុងជាតិដែក\n- ធ្លាក់ចុះការបង្កើតអេម៉ូក្លូប៊ីន\n- អនាមីក្រូស៊ីត (Anémie microcytaire)", fr: "- Épuisement des réserves en fer\n- Érythropoïèse déficitaire en fer\n- Anémie microcytaire", en: "- Depletion of iron stores\n- Iron-deficient erythropoiesis\n- Microcytic anemia" } },
            { id: 12, km: "តើទារកមានប្រភពជាតិដែកពីណាមកខ្លះនៅពេលកើត?", fr: "Quelles sont les sources de fer du nouveau-né à la naissance?", en: "What are the newborn's sources of iron at birth?", answer: { km: "- ជាតិដែកផ្ទេរពីម្តាយតាមរយៈรก (Fer transplacentaire) ក្នុងត្រីមាសទី៣។", fr: "- Le fer transplacentaire reçu de la mère au troisième trimestre.", en: "- Transplacental iron received from the mother in the third trimester." } },
            { id: 13, km: "តើគោលការណ៍ព្យាបាលជំងឺរលាកទងសួតស្រួចស្រាវ (Bronchiolite) មានអ្វីខ្លះ?", fr: "Quels sont les principes du traitement de la bronchiolite aiguë?", en: "What are the principles of treatment for acute bronchiolitis?", answer: { km: "- បឺតជញ្ជក់លחהច្រមុះ (DRPH)\n- ឱ្យទឹកគ្រប់គ្រាន់ និងបែងចែកចំណីអាហារជាច្រើនដង", fr: "- DRPH (Désobstruction rhinopharyngée)\n- Hydratation adéquate et fractionnement des repas", en: "- Nasal clearance (DRPH)\n- Adequate hydration and fractionated meals" } },
            { id: 14, km: "តើផលវិបាកអ្វីខ្លះដែលងាយកើតមានចំពោះកុមារកើតមិនគ្រប់ខែ (Nouveau-né prématuré)?", fr: "Quelles sont les complications fréquentes chez le nouveau-né prématuré?", en: "What are the common complications in premature newborns?", answer: { km: "- វិបត្តិដកដង្ហើម (MMH)\n- ការហូរឈាមក្នុងខួរក្បាល\n- ការរលាកពោះវៀនហ្វុយមីណង់", fr: "- Détresse respiratoire (MMH)\n- Hémorragie intra-ventriculaire\n- Entérocolite ulso-nécrotique", en: "- Respiratory distress syndrome\n- Intraventricular hemorrhage\n- Necrotizing enterocolitis" } },
            { id: 15, km: "តើការកំណត់អាយុគភ៌ (Âge gestationnel) គិតផ្អែកលើអ្វីខ្លះ?", fr: "Sur quoi se base la détermination de l'âge gestationnel?", en: "What is the determination of gestational age based on?", answer: { km: "- ថ្ងៃមករដូវចុងក្រោយ (DDR)\n- អ៊ុលត្រាសោនត្រីមាសទី១\n- ពិន្ទុ Ballard ឬ Dubowitz", fr: "- Date des dernières règles (DDR)\n- Échographie du 1er trimestre\n- Score de Ballard ou Dubowitz", en: "- Last menstrual period (LMP)\n- First-trimester ultrasound\n- Ballard or Dubowitz score" } },
            { id: 16, km: "តើអ្វីជាមូលហេតុចម្បងនៃការឡើងលឿងចំពោះទារកទើបកើត (Ictère néonatal)?", fr: "Quelles sont les causes principales de l'ictère néonatal?", en: "What are the main causes of neonatal jaundice?", answer: { km: "- Ictère physiologique\n- Incompatibilité ABO ឬ Rhésus\n- Ictère au lait de mère", fr: "- Ictère physiologique\n- Incompatibilité ABO ou Rhésus\n- Ictère au lait de mère", en: "- Physiological jaundice\n- ABO or Rh incompatibility\n- Breast milk jaundice" } },
            { id: 17, km: "តើគោលការណ៍ព្យាបាលជំងឺរលាកសួតស្រួចស្រាវ (Pneumonie aiguë) លើកុមារមានអ្វីខ្លះ?", fr: "Quels sont les principes du traitement de la pneumonie aiguë chez l'enfant?", en: "What are the principles of treatment for acute pneumonia in children?", answer: { km: "- ថ្នាំផ្សះតាមការកំណត់\n- អុកស៊ីសែន និងការផ្តល់ជាតិទឹក", fr: "- Antibiothérapie adaptée\n- Oxygénothérapie et hydratation adéquate", en: "- Appropriate antibiotic therapy\n- Oxygen therapy and adequate hydration" } },
            { id: 18, km: "តើอาการសំខាន់ៗនៃជំងឺខ្សោយបេះដូងលើកុមារ (Insuffisance cardiaque chez l'enfant) មានអ្វីខ្លះ?", fr: "Quels sont les principaux signes de l'insuffisance cardiaque chez l'enfant?", en: "What are the main signs of heart failure in children?", answer: { km: "- ដង្ហើមញាប់, បែកញើសពេលបៅ\n- ខ្សោយឡើងទម្ងន់, ថ្លើមធំ", fr: "- Tachypnée, sueurs profuses lors des tétées\n- Cassure de la courbe de poids, hépatomégalie", en: "- Tachypnea, profuse sweating during feeding\n- Failure to thrive, hepatomegaly" } },
            { id: 19, km: "តើការចាត់ថ្នាក់កម្រិតនៃការខ្សោះជាតិទឹក (Déshydratation) តាមអង្គការសុខភាពពិភពលោក (OMS) មានអ្វីខ្លះ?", fr: "Quelles sont les classifications de la déshydratation selon l'OMS?", en: "What are the classifications of dehydration according to WHO?", answer: { km: "- គ្មានការខ្សោះជាតិទឹក\n- ខ្សោះកម្រិតស្រាលដល់មធ្យម\n- ខ្សោះកម្រិតធ្ងន់ធ្ងរ", fr: "- Pas de déshydratation\n- Déshydratation modérée\n- Déshydratation sévère", en: "- No dehydration\n- Moderate dehydration\n- Severe dehydration" } },
            { id: 20, km: "តើការការពារជំងឺរាកស្រួចស្រាវ (Diarrhée aiguë) លើកុមារត្រូវធ្វើដូចម្តេច?", fr: "Comment prévenir la diarrhée aiguë chez l'enfant?", en: "How to prevent acute diarrhea in children?", answer: { km: "- បំបៅដោះកូនផ្តាច់មុខ ៦ខែ\n- លាងដៃនឹងសាប៊ូ និងប្រើប្រាស់ទឹកស្អាត", fr: "- Allaitement maternel exclusif jusqu'à 6 mois\n- Lavage des mains et eau propre", en: "- Exclusive breastfeeding up to 6 months\n- Handwashing and clean water" } },
            { id: 21, km: "តើផលវិបាកធ្ងន់ធ្ងរបំផុតនៃការខ្សោះជាតិទឹកមានអ្វីខ្លះ?", fr: "Quelles sont les complications les plus graves de la déshydratation?", en: "What are the most severe complications of dehydration?", answer: { km: "- ស្ដុបបេះដូងសរសៃឈាម (Choc hypovolémique)\n- ខ្សោយតម្រងនោមស្រួចស្រាវ", fr: "- Choc hypovolémique\n- Insuffisance rénale aiguë", en: "- Hypovolemic shock\n- Acute renal failure" } },
            { id: 22, km: "តើការវាយតម្លៃស្ថានភាពអាហារូបត្ថម្ភរបស់កុមារត្រូវប្រើសន្ទស្សន៍អ្វីខ្លះ?", fr: "Quels indices utilise-t-on pour évaluer l'état nutritionnel de l'enfant?", en: "What indices are used to assess a child's nutritional status?", answer: { km: "- ទម្ងន់ធៀបអាយុ, កម្ពស់ធៀបអាយុ, ទម្ងន់ធៀបកម្ពស់, ទំហំ vong bras (PB)", fr: "- Poids pour l'âge, Taille pour l'âge, Poids pour la taille, Périmètre brachial (PB)", en: "- Weight-for-age, Height-for-age, Weight-for-height, MUAC" } },
            { id: 23, km: "តើគោលការណ៍ណែនាំក្នុងការផ្ដល់អាហារបន្ថែម ចាប់ផ្តើមនៅអាយុប៉ុន្មាន?", fr: "À quel âge doit-on commencer la diversification alimentaire?", en: "At what age should complementary feeding start?", answer: { km: "- ចាប់ផ្តើមនៅអាយុ ៦ខែបរិបូរណ៍ ព្រមទាំងបន្តបំបៅដោះ។", fr: "- À l'âge de 6 mois révolus, tout en continuant l'allaitement.", en: "- At completed 6 months of age, continuing breastfeeding." } },
            { id: 24, km: "តើការពិនិត្យទូទៅពេលដំបូងចំពោះទារកទើបកើត មានគោលដៅអ្វី?", fr: "Quel est l'objectif de l'examen clinique initial du nouveau-né?", en: "What is the objective of the initial clinical examination of the newborn?", answer: { km: "- រកមើលភាពមិនប្រក្រតី congenital ធ្ងន់ធ្ងរ\n- វាយតម្លៃការសម្របខ្លួន (ពិន្ទុ Apgar)", fr: "- Détecter les anomalies congénitales majeures\n- Évaluer l'adaptation (Score d'Apgar)", en: "- Detect major congenital anomalies\n- Assess adaptation (Apgar score)" } },
            { id: 25, km: "តើវ៉ាក់សាំងអ្វីខ្លះដែលត្រូវផ្តល់ឱ្យទារកភ្លាមក្រោយពេលកើតនៅកម្ពុជា?", fr: "Quels vaccins doivent être administrés au nouveau-né immédiatement après la naissance au Cambodge?", en: "What vaccines should be given to newborns immediately after birth in Cambodia?", answer: { km: "- វ៉ាក់សាំងរលាកថ្លើមបេ (ក្នុង ២៤ម៉ោងដំបូង)\n- វ៉ាក់សាំង BCG", fr: "- Hépatite B (dans les 24h)\n- Vaccin BCG", en: "- Hepatitis B (within 24h)\n- BCG vaccine" } },
            { id: 26, km: "តើធ្វើដូចម្តេចដើម្បីធ្វើរោគវិនិច្ឆ័យជំងឺ pleurésie purulente?", fr: "Comment diagnostiquer la pleurésie purulente?", en: "How to diagnose pleurisy?", answer: { km: "- រស្មីសួត/អ៊ុលត្រាសោន និងការវិភាគទឹក (Exsudative, pH < 7.2, GB > 10000)", fr: "- Imagerie + Analyse du liquide (Exsudatif, pH < 7.2, GB > 10000)", en: "- Imaging + Fluid analysis (Exudative, pH < 7.2, WBC > 10000)" } },
            { id: 27, km: "តើប៉ារ៉ាម៉ែត្រនៃពិន្ទុ Apgar មានអ្វីខ្លះ?", fr: "Quels sont les paramètres du score d’Apgar?", en: "What are the parameters of the Apgar score?", answer: { km: "- ធម្មតា: 7-10\n- Asphyxie modérée: 4-6\n- Asphyxie sévère: 0-3", fr: "- Normale : 7-10\n- Asphyxie modérée : 4-6\n- Asphyxie sévère : 0-3", en: "- Normal: 7-10\n- Moderate asphyxia: 4-6\n- Severe asphyxia: 0-3" } },
            { id: 28, km: "តើប៉ារ៉ាម៉ែត្រនៃពិន្ទុ Silverman មានអ្វីខ្លះ?", fr: "Quels sont les paramètres du score de Silverman?", en: "What are the parameters of the Silverman score?", answer: { km: "- < 4: IR légère (+ O2)\n- 4-6: IR moyenne (+ CPAP)\n- > 6: IR grave (+ Intubation)", fr: "- < 4 : IR légère (+ O2)\n- 4-6 : IR moyenne (+ CPAP)\n- > 6 : IR grave (+ Intubation)", en: "- < 4: Mild distress (+ O2)\n- 4-6: Moderate distress (+ CPAP)\n- > 6: Severe distress (+ Intubation)" } },
            { id: 29, km: "ចូរចាត់ថ្នាក់ការរលាកស្រោមខួរ រលាកបំពង់ក និងមេរោគរបេង។", fr: "Classer la méningite, l’angine streptococcique et Mycobacterium tuberculosis.", en: "Classify meningitis, streptococcal pharyngitis, and tuberculosis.", answer: { km: "- ការចាត់ថ្នាក់តាមភ្នាក់ងារបង្ក និងទីតាំងរលាក។", fr: "- Classification selon l'agent pathogène.", en: "- Classification according to pathogen." } },
            { id: 30, km: "តើការរលាកស្រោមខួរក្បាលប្រភេទណាខ្លះដែលទាក់ទងនឹងដំបៅលលាដ៍ក្បាល?", fr: "Quelles méningites sont associées à des lésions crâniennes?", en: "Which meningitis cases are associated with cranial lesions?", answer: { km: "- រលាកស្រោមខួរបាក់តេរីបន្ទាប់ពីមានការបាក់លលាដ៍ក្បាល។", fr: "- Méningite bactérienne post-traumatique.", en: "- Post-traumatic bacterial meningitis." } },
            { id: 31, km: "រោគវិនិច្ឆ័យចំពោះ méningite lymphocytaire រួមនឹង transaminases ខ្ពស់ និងខ្សោយតម្រងនោម។", fr: "Méningite lymphocytaire associée à une élévation des transaminases et insuffisance rénale.", en: "Lymphocytic meningitis with elevated transaminases and renal failure.", answer: { km: "- គិតដល់ Leptospirosis ឬ arbovirose ជាដើម។", fr: "- Évoquer une leptospirose.", en: "- Suspect leptospirosis." } },
            { id: 32, km: "ការឱ្យថ្នាំផ្សះប្រឆាំងមេនីងកុកជាបន្ទាន់នៅផ្ទះ។", fr: "Antibiothérapie parentérale anti-méningococcique au domicile.", en: "Parenteral anti-meningococcal antibiotics at home.", answer: { km: "- ករណីមានការសង្ស័យខ្លាំងលើ purpura fulminans។", fr: "- En cas de suspicion de purpura fulminans.", en: "- In suspected purpura fulminans." } },
            { id: 33, km: "ថ្នាំផ្សះសរសៃឈាមវែនសម្រាប់ méningite purulente ឃើញ coccs gram négatif។", fr: "ATB IV pour méningite purulente avec coccs gram négatif.", en: "IV antibiotics for purulent meningitis with gram-negative cocci.", answer: { km: "- ប្រើប្រាស់ Cefotaxime ឬ Ceftriaxone។", fr: "- Céfotaxime ou Ceftriaxone.", en: "- Cefotaxime or Ceftriaxone." } },
            { id: 34, km: "តើមូលហេតុអ្វីខ្លះធ្វើឱ្យទារកកើតខ្សោយអាហារូបត្ថម្ភធ្ងន់ធ្ងរ (MPE)?", fr: "Quelles sont les causes de la MPE chez l'enfant?", en: "What are the causes of PEM in infants?", answer: { km: "- ខ្វះប្រូតេអ៊ីន ថាមពល វីតាមីន និងសារធាតុរ៉ែ។", fr: "- Carence en protéines, énergie, vitamines et oligo-éléments.", en: "- Protein, energy, vitamin, and mineral deficiency." } },
            { id: 35, km: "សញ្ញាបែងចែករវាង Marasme និង Kwashiorkor។", fr: "Signes distinctifs entre le marasme et le kwashiorkor.", en: "Distinguishing signs between marasme and kwashiorkor.", answer: { km: "- Marasme: ស្គមខ្លាំង គ្មានក្រហើមទឹក ចង់ស៊ីចំណីខ្លាំង។\n- Kwashiorkor: មានក្រហើមទឹក (Oedema), មុខមូលហើម (Moon face), បាត់បង់ចំណង់អាហារ។", fr: "- Marasme : Maigreur extrême, pas d'œdème, appétit vorace.\n- Kwashiorkor : Œdèmes, visage lunaire, perte d'appétit.", en: "- Marasme: Severe wasting, no edema, voracious appetite.\n- Kwashiorkor: Edema, moon face, poor appetite." } },
            { id: 36, km: "វិធីសាស្ត្រការពារជំងឺ Marasme និង Kwashiorkor។", fr: "Méthodes de prévention du marasme et du kwashiorkor.", en: "Prevention methods for marasme and kwashiorkor.", answer: { km: "- គ្រោងទុកគ្រួសារ, ចាក់វ៉ាក់សាំង, លើកទឹកចិត្តបំបៅដោះ និងអប់រំម្តាយ។", fr: "- Planning familial, vaccination, allaitement, éducation des mères.", en: "- Family planning, vaccination, breastfeeding, maternal education." } },
            { id: 37, km: "ទំនាក់ទំនងរវាងការរលាកសរសៃទឹកនោម និង SHU។", fr: "Liens entre l'infection urinaire et le SHU.", en: "Links between urinary tract infection and HUS.", answer: { km: "- ការរលាកតម្រងនោម (Pyélonéphrite) និងហានិភ័យខូចខាតເນុចតម្រងនោម។", fr: "- Pyélonéphrite et risque de séquelle parenchymateuse.", en: "- Pyelonephritis and risk of parenchymal damage." } },
            { id: 38, km: "សញ្ញាគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃគ្រុនឈាមរាកហូរឈាម (DHF)។", fr: "Signes cliniques et paracliniques de la DHF.", en: "Clinical and paraclinical signs of DHF.", answer: { km: "- ដំណាក់កាលវិបត្តិ (Critical phase), ប្លាកែតធ្លាក់ និងលេចធ្លាយប្លាស្មា។", fr: "- Phase critique, thrombopénie et fuite plasmatique.", en: "- Critical phase, thrombocytopenia, and plasma leakage." } },
            { id: 39, km: "និយមន័យនៃ Idiopathic Thrombocytopenia Purpura (ITP)។", fr: "Définition du purpura thrombopénique idiopathique (ITP).", en: "Definition of ITP.", answer: { km: "- ការធ្លាក់ចុះប្លាកែតដាច់ដោយឡែក បង្កដោយការបំផ្លាញប្លាកែតដោយ macrophages។", fr: "- Thrombopéniue isolée secondaire à une destruction accrue des plaquettes.", en: "- Isolated thrombocytopenia secondary to increased platelet destruction." } },

        function updateContent() {
            const q = questionsData[currentIdx];
            
            document.getElementById('current-q-num').textContent = currentIdx + 1;
            document.getElementById('total-q-num').textContent = questionsData.length;
            
            document.getElementById('question-badge').textContent = uiTexts[currentLang].badge + (currentIdx + 1);
            document.getElementById('question-text').textContent = q[currentLang];
            document.getElementById('answer-text').textContent = q.answer ? q.answer[currentLang] : "កំពុងរៀបចំចម្លើយ...";

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').disabled = currentIdx === questionsData.length - 1;

            updatePaginationButtons();
        }

        function nextQuestion() {
            if (currentIdx < questionsData.length - 1) {
                currentIdx++;
                updateContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                updateContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion(index) {
            currentIdx = index;
            updateContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50";
            });
            document.getElementById(`btn-${lang}`).className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-white text-indigo-700 shadow-sm";

            document.getElementById('page-title').textContent = uiTexts[lang].title;
            document.getElementById('main-header-title').textContent = uiTexts[lang].headerTitle;
            document.getElementById('main-header-subtitle').textContent = uiTexts[lang].headerSubtitle;
            document.getElementById('jumpto-text').textContent = uiTexts[lang].jumpto;
            document.getElementById('footer-text').textContent = uiTexts[lang].footer;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (uiTexts[lang][key]) {
                    el.textContent = uiTexts[lang][key];
                }
            });

            updateContent();
        }

        function buildPaginationGrid() {
            const grid = document.getElementById('pagination-grid');
            grid.innerHTML = '';
            for (let i = 0; i < questionsData.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.className = `w-8 h-8 text-xs font-semibold rounded-lg transition-all border ${i === currentIdx ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
                btn.onclick = () => jumpToQuestion(i);
                btn.id = `pag-btn-${i}`;
                grid.appendChild(btn);
            }
        }

        >updatePaginationButtons();

        // Initialize App
        buildPaginationGrid();
        updateContent();
    </script>
