<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">កម្រងសំណួររោគកុមារ (១-៦៣)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 id="ui-header-title" class="text-xl sm:text-2xl font-bold tracking-wide text-center sm:text-left">កម្រងសំណួររោគកុមារ (១ - ៦៣)</h1>
                <p id="ui-header-subtitle" class="text-xs sm:text-sm text-indigo-200 text-center sm:text-left">រៀបរាងដោយ ឃួន ថាវ៉ាន់</p>
            </div>
            <div class="flex items-center gap-2 bg-indigo-800/60 p-1.5 rounded-xl border border-indigo-500/30">
                <button onclick="setLanguage('km')" id="btn-km" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-white text-indigo-700 shadow-sm">ភាសាខ្មែរ</button>
                <button onclick="setLanguage('fr')" id="btn-fr" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50">Français</button>
                <button onclick="setLanguage('en')" id="btn-en" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50">English</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="prevQuestion()" id="prev-btn" class="flex items-center gap-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                <span id="ui-prev">មុន</span>
            </button>
            <div class="text-sm sm:text-base font-semibold text-indigo-600">
                <span id="current-q-num">1</span> / <span id="total-q-num">63</span>
            </div>
            <button onclick="nextQuestion()" id="next-btn" class="flex items-center gap-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-all shadow-md shadow-indigo-200">
                <span id="ui-next">បន្ទាប់</span>
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 transition-all duration-300">
            <div class="flex items-center justify-between mb-4">
                <span id="question-badge" class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-full uppercase tracking-wider">សំណួរទី 1</span>
            </div>
            
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-relaxed"></h2>

            <div class="border-t border-slate-100 pt-6">
                <h3 id="ui-answer-label" class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                    <span>ចម្លើយ</span>
                </h3>
                <div id="answer-text" class="text-slate-700 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100 leading-relaxed whitespace-pre-line text-sm sm:text-base"></div>
            </div>
        </div>

        <div class="mt-8 bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
            <p id="ui-jumpto" class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider text-center">ជ្រើសរើសសំណួររហ័ស (១ ដល់ ៦៣)</p>
            <div id="pagination-grid" class="flex flex-wrap gap-1.5 justify-center max-h-48 overflow-y-auto p-1"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-12">
        <p id="ui-footer">កម្រងសំណួររោគកុមារ (Pediatric QROC) | រៀបរាងដោយ ឃួន ថាវ៉ាន់</p>
    </footer>

    <!-- ហៅទិន្នន័យពី data.js មកប្រើប្រាស់ -->
    <script src="data.js"></script>
    <script>
        const uiTexts = {
            km: {
                title: "កម្រងសំណួររោគកុមារ (១-៦៣)",
                headerTitle: "កម្រងសំណួររោគកុមារ (១ - ៦៣)",
                headerSub: "រៀបរាងដោយ ឃួន ថាវ៉ាន់",
                prev: "មុន",
                next: "បន្ទាប់",
                answer: "ចម្លើយ",
                jumpTo: "ជ្រើសរើសសំណួររហ័ស (១ ដល់ ៦៣)",
                footer: "កម្រងសំណួររោគកុមារ (Pediatric QROC) | រៀបរាងដោយ ឃួន ថាវ៉ាន់",
                badge: "សំណួរទី "
            },
            fr: {
                title: "Questions de Pédiatrie (1-63)",
                headerTitle: "Questions de Pédiatrie (1 - 63)",
                headerSub: "Préparé par Khoun Thavan",
                prev: "Précédent",
                next: "Suivant",
                answer: "Réponse",
                jumpTo: "Accès rapide aux questions (1 à 63)",
                footer: "Questions de Pédiatrie (Pediatric QROC) | Préparé par Khoun Thavan",
                badge: "Question N° "
            },
            en: {
                title: "Pediatric Questions (1-63)",
                headerTitle: "Pediatric Questions (1 - 63)",
                headerSub: "Prepared by Khoun Thavan",
                prev: "Previous",
                next: "Next",
                answer: "Answer",
                jumpTo: "Quick Jump (1 to 63)",
                footer: "Pediatric Questions (Pediatric QROC) | Prepared by Khoun Thavan",
                badge: "Question "
            }
        };

        let currentLang = 'km'; 
        let currentIdx = 0;

        function updateUI() {
            const t = uiTexts[currentLang];
            document.getElementById('page-title').textContent = t.title;
            document.getElementById('ui-header-title').textContent = t.headerTitle;
            document.getElementById('ui-header-subtitle').textContent = t.headerSub;
            document.getElementById('ui-prev').textContent = t.prev;
            document.getElementById('ui-next').textContent = t.next;
            document.getElementById('ui-answer-label').querySelector('span').textContent = t.answer;
            document.getElementById('ui-jumpto').textContent = t.jumpTo;
            document.getElementById('ui-footer').textContent = t.footer;
        }

        function updateContent() {
            if (typeof questionsData === 'undefined' || questionsData.length === 0) return;
            if (currentIdx >= questionsData.length) currentIdx = 0;
            const q = questionsData[currentIdx];
            const t = uiTexts[currentLang];
            
            document.getElementById('current-q-num').textContent = currentIdx + 1;
            document.getElementById('total-q-num').textContent = questionsData.length;
            
            document.getElementById('question-badge').textContent = t.badge + (currentIdx + 1);
            document.getElementById('question-text').textContent = q[currentLang] || q.km;
            
            let ans = "";
            if (q.answer) {
                ans = q.answer[currentLang] || q.answer.km || "";
            }
            document.getElementById('answer-text').textContent = ans;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').disabled = currentIdx === questionsData.length - 1;

            updatePaginationGridState();
        }

        function nextQuestion() {
            if (currentIdx < questionsData.length - 1) {
                currentIdx++;
                updateContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                updateContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion(index) {
            currentIdx = index;
            updateContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50";
            });
            document.getElementById(`btn-${lang}`).className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-white text-indigo-700 shadow-sm";
            
            updateUI();
            updateContent();
        }

        function buildPaginationGrid() {
            if (typeof questionsData === 'undefined') return;
            const grid = document.getElementById('pagination-grid');
            grid.innerHTML = '';
            for (let i = 0; i < questionsData.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.id = `pag-btn-${i}`;
                btn.onclick = (function(idx) {
                    return function() { jumpToQuestion(idx); }
                })(i);
                grid.appendChild(btn);
            }
            updatePaginationGridState();
        }

        function updatePaginationGridState() {
            if (typeof questionsData === 'undefined') return;
            for (let i = 0; i < questionsData.length; i++) {
                const btn = document.getElementById(`pag-btn-${i}`);
                if(btn) {
                    if(i === currentIdx) {
                        btn.className = "w-8 h-8 text-xs font-semibold rounded-lg transition-all border bg-indigo-600 text-white border-indigo-600 shadow-sm";
                    } else {
                        btn.className = "w-8 h-8 text-xs font-semibold rounded-lg transition-all border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100";
                    }
                }
            }
        }

        // ចាប់ផ្ដើមដំណើរការពេលវេបសាយផ្ទុកទិន្នន័យរួច
        window.onload = function() {
            updateUI();
            buildPaginationGrid();
            updateContent();
        };
    </script>
</body>
</html>
