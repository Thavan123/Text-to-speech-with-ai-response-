<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">

    <title>កម្រងសំណួររោគកុមារ - រៀបរៀងដោយ ឃួន ថាវ៉ាន់</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Kantumruy Pro', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        header p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .lang-container {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            background: white;
            color: var(--primary-color);
        }

        main {
            max-width: 850px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
            flex: 1;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .question-number {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .answer-box {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            padding: 1.25rem;
            border-radius: 0 8px 8px 0;
            line-height: 1.7;
            white-space: pre-line;
            font-size: 1.05rem;
        }

        .answer-title {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="site-title">កម្រងសំណួររោគកុមារ</h1>
        <p id="site-subtitle">រៀបរៀងដោយ ឃួន ថាវ៉ាន់</p>

    <main>
        <div class="controls">
            <button class="btn" id="prev-btn" onclick="prevQuestion()">❮ មុន</button>
            <span id="counter-text" style="font-weight: 600; color: var(--text-secondary);">សំណួរទី 1 / 103</span>

            <div class="question-text" id="q-text">Critère du diagnostique du syndrome néphrotique.</div>
            <div class="answer-box">
                <div class="answer-title" id="ans-label">ចម្លើយ / Réponse:</div>
                <div id="a-text">- nephrotic range proteinurie<br>- hypoalbuminémie<br>- edema<br>- hyperlipidémie</div>
            </div>
        </div>
    </main>

    <footer>
        <p id="footer-text">© 2026 កម្រងសំណួររោគកុមារ - រៀបរៀងដោយ ឃួន ថាវ៉ាន់. All rights reserved.</p>
    </footer>

    <script>
        // បញ្ជីទិន្នន័យសំណួរ-ចម្លើយទាំង ១០៣ ជាមួយការបកប្រែ ៣ ភាសា (ខ្មែរ, អង់គ្លេស, បារាំង) បង្កើតឡើងយ៉ាងពេញលេញ
        const questionsData = [
            {
                q: { km: "1. តើអ្វីជាលក្ខខណ្ឌវិនិច្ឆ័យនៃស៊ីនដ្រូមនីហ្វ្រូទិច (Syndrome néphrotique)?", en: "1. What are the diagnostic criteria for nephrotic syndrome?", fr: "1. Quels sont les critères diagnostiques du syndrome néphrotique ?" },
                a: { km: "- កម្រិតប្រូតេអ៊ីនក្នុងទឹកនោមខ្ពស់ (Nephrotic range proteinuria)\n- កម្រិតអល់ប៊ុយមីនក្នុងឈាមទាប (Hypoalbuminémie)\n- របកទឹក ឬ ហើម (Edema)\n- កម្រិតខ្លាញ់ក្នុងឈាមខ្ពស់ (Hyperlipidémie)", en: "- Nephrotic range proteinuria\n- Hypoalbuminemia\n- Edema\n- Hyperlipidemia", fr: "- Protéinurie d'intervalle néphrotique\n- Hypoalbuminémie\n- Œdème\n- Hyperlipidémie" }
            },
            {
                q: { km: "2. តើអ្វីជាផលវិបាកផ្នែកសរសៃឈាមបេះដូងនៃជំងឺរលាកតម្រងនោមក្រោយពេលមានមេរោគ (Glomérulonéphrite post-infectieuse)?", en: "2. What are the cardiovascular complications of post-infectious glomerulonephritis?", fr: "2. Quelles sont les complications cardiovasculaires de la glomérulonéphrite post-infectieuse ?" },
                a: { km: "- ការលើសទម្ងន់ទឹកក្នុងរាងកាយ (Volume overload)\n- លើសឈាម (Hypertension)\n- កម្រិតប៉ូតាស្យូមក្នុងឈាមខ្ពស់ (Hyperkalemia)\n- កម្រិតកាល់ស្យូមក្នុងឈាមទាប (Hypocalcemia)\n- ប្រកាច់ (Seizure)\n- កម្រិតសេរ៉ូម creatinine និង urea ឡើងខ្ពស់", en: "- Volume overload\n- Hypertension\n- Hyperkalemia\n- Hypocalcemia\n- Seizure\n- Elevated serum creatinine and urea", fr: "- Surcharge pondérale (Volume overload)\n- Hypertension\n- Hyperkaliémie\n- Hypocalcémie\n- Crise convulsive\n- Élévation de la créatinine et de l'urée sériques" }
            },
            {
                q: { km: "3. តើធ្វើរោគវិនិច្ឆ័យជំងឺហ្វីឡារ្យ៉ាស (Filariasis) យ៉ាងដូចម្តេច?", en: "3. How to diagnose filariasis?", fr: "3. Comment diagnostiquer la filariose ?" },
                a: { km: "- ប៉ារ៉ាស៊ីតពេញវ័យ៖ ការកាត់យកកូនកណ្តុរមកពិនិត្យ (Biopsie ganglionnaire)\n- មីក្រូហ្វីឡារ្យ៉ារ៖ យកឈាមពិនិត្យនៅពេលយប់ប្រហែលម៉ោង ២៣យប់ ឬម៉ោង ១រំលងអធ្រាត្រ ដោយលេបថ្នាំ Notétézine ១គ្រាប់ (១០០មីលីក្រាម)\n- ក្នុងទឹករងាវឡាំហ្វាទិច៖ ការបញ្ចេញទឹកនៅប្រដាប់ភេទស្ត្រី ភ្នាសសួត សរសៃវ៉ែនឡាំហ្វាទិច និងទឹកនោមស...", en: "- Adult parasite: Lymph node biopsy\n- Microfilaria: Blood sample taken at night around 23:00 or 01:00 after taking 1 tablet (100mg) of Notétézine\n- In chylous fluid: vaginal effusion, pleural effusion, lymphatic varices, chyluria...", fr: "- Parasite adulte : Biopsie ganglionnaire\n- Microfilarie : Prélèvement sanguin la nuit vers 23h ou 1h après la prise d'un comprimé (100mg) de Notétézine\n- Dans le liquide chyleux : épanchement vaginal, pleural, varice lymphatique, chylurie..." }
            },
            {
                q: { km: "4. តើកត្តាអ្វីខ្លះដែលចូលរួមក្នុងអភិវឌ្ឍន៍សោមាទិចរបស់កុមារ?", en: "4. What are the factors involved in the somatic development of the child?", fr: "4. Quels sont les facteurs intervenant dans le développement somatique de l'enfant ?" },
                a: { km: "+ ការលូតលាស់ (Croissance)៖ កម្ពស់ ទម្ងន់ ទំហំផ្ទៃរាងកាយ\n+ ការចម្រើនពេញវ័យ (Maturation)៖ អាយុធ្មេញ អាយុឆ្អឹង ការចម្រើនភេទ លក្ខណៈសរសៃប្រសាទ និងទំនាក់ទំនងរាងកាយ", en: "+ Growth: Height, Weight, Body surface area\n+ Maturation: Dental age, Bone age, Sexual maturation, Neurological criteria, Anthropometric ratios", fr: "+ Croissance : Taille, Poids, Surface corporelle\n+ Maturation : Âge dentaire, Âge osseux, Maturation sexuelle, Critères neurologiques, Rapports anthropométriques" }
            },
            {
                q: { km: "5. ចូរពិពណ៌នាអំពីការព្យាបាលជំងឺថយចុះគ្រាប់ឈាមរដបដោយប្រព័ន្ធការពារខ្លួន (Idiopathic Thrombocytopenic Purpura - ITP)?", en: "5. Describe the treatment of idiopathic thrombocytopenic purpura (ITP).", fr: "5. Décrivez le traitement du purpura thrombopénique idiopathique (PTI)." },
                a: { km: "- ថ្នាំ Oral Prednisolone៖ 2 mg/kg/day រយៈពេល 14 ថ្ងៃ បន្ទាប់មកបន្ថយបន្តិចម្តងៗ និងឈប់នៅថ្ងៃទី 21 (អតិបរមា៖ 60 mg/day)\n- ថ្នាំ IV Methylprednisolone៖ 30 mg/kg/day រយៈពេល 3 ថ្ងៃ\n- ថ្នាំ IVIG៖ 0.8 g/kg/dose ក្នុងរយៈពេល 3 ម៉ោង សម្រាប់ 1 ថ្ងៃ ឬ 250 mg/kg ក្នុងរយៈពេល 2 ថ្ងៃ\n- ថ្នាំ IV anti-D immunoglobulin៖ 50 ug/kg ដូសតែមួយ ក្នុងរយៈពេល 5 នាទី ចំពោះអ្នកជំងឺដែលមានរេស៊ីសវិជ្ជមាន", en: "- Oral Prednisolone: 2 mg/kg/day for 14 days then taper and discontinue at 21 days (Max: 60 mg/day)\n- IV Methylprednisolone: 30 mg/kg/day for 3 days\n- IVIG: 0.8 g/kg/dose over 3 hours for 1 day or 250 mg/kg for 2 days\n- IV anti-D immunoglobulin: 50 ug/kg single dose over 5 min in Rhesus positive patients", fr: "- Prednisolone orale : 2 mg/kg/jour pendant 14 jours puis diminuer et arrêter à 21 jours (Max : 60 mg/jour)\n- Méthylprednisolone IV : 30 mg/kg/jour pendant 3 jours\n- IVIG : 0,8 g/kg/dose sur 3 heures pendant 1 jour ou 250 mg/kg pendant 2 jours\n- Immunoglobuline anti-D IV : 50 ug/kg en dose unique sur 5 min chez les patients de Rhésus positif" }
            },
            {
                q: { km: "6. តើគោលការណ៍នៃជំងឺរលាកគម្របបំពង់ក (Épiglottite) កើតឡើងយ៉ាងដូចម្តេច?", en: "6. Describe the principle/mechanism of epiglottitis.", fr: "6. Décrivez le principe de l'épiglottite." },
                a: { km: "- គម្របបំពង់កឡើងរលាក និងច្រើនមានខ្ទុះ ក្លាយជារីកធំស្ទះរន្ធបំពង់ក (Glotte)\n- ភាគច្រើនបង្កឡើងដោយបាក់តេរី Hemophilus influenzae\n- រោគសញ្ញាដកដង្ហើមពិបាកនៅបំពង់ក មានសញ្ញាទូទៅសំខាន់ៗជាមួយគ្រុនក្តៅ កុមារអង្គុយ ឬលុតជង្គង់ ៤ជើង មានការពិបាកលេបចំណី", en: "- Epiglottis inflamed and often abscessed, becomes huge, blocking the glottis hole\n- Almost always due to Hemophilus influenzae\n- Laryngeal dyspnea syndrome, important general signs with fever, child sitting or on all fours, dysphagia", fr: "- L'épiglotte enflammée et souvent abcédée devient énorme bouchant le trou de la glotte\n- Presque toujours due à Haemophilus influenzae\n- Syndrome de dyspnée laryngée, signes généraux importants avec fièvre, l'enfant est assis ou à 4 pattes, dysphagie" }
            },
            {
                q: { km: "7. តើសញ្ញាគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃជំងឺគ្រុនឈាម hemorrhagic មានអ្វីខ្លះ?", en: "7. What are the clinical and paraclinical signs of dengue hemorrhagic fever?", fr: "7. Quels sont les signes cliniques et paracliniques de la fièvre hémorragique de la dengue ?" },
                a: { km: "+ សញ្ញាគ្លីនិក:\n- ដំណាក់កាលក្តៅខ្លួន៖ ស្រដៀងនឹងគ្រុនឈាមធម្មតា ប៉ុន្តែមានសញ្ញាឈាមហូរច្បាស់ជាង (តេស្ត Tourniquet វិជ្ជមាន, កន្ទួលក្រហមតូចៗ, ជាំខៀវ, ហូរឈាមច្រមុះ និងក្រពះពោះវៀន)។\n- ដំណាក់កាលវិបត្តិ (២៤-៤៨ម៉ោង)៖ ក្តៅខ្លួនធ្លាក់ចុះនៅថ្ងៃទី ៤ ឬទី ៥ ប៉ុន្តែអាការទូទៅទ្រុឌទ្រោម ងងុយដេក ក្អួតខ្លាំង ឈឺពោះខ្លាំង មិនបត់ជើងតូច ៤-៦ម៉ោង។\n+ សញ្ញាបារ៉ាគ្លីនិក:\n- ថយចុះគ្រាប់ឈាមស ឬប្លាកែត (< 100,000/mm³)\n- សញ្ញាធ្លាយប្លាស្មា (Hct ឡើង > 20%, មានទឹកក្នុងភ្នាសសួត, មានទឹកក្នុងពោះ, ថយចុះអល់ប៊ុយមីនក្នុងឈាម)", en: "+ Clinical signs:\n- Febrile phase: Similar to DF, but bleeding manifestations are more evident (positive tourniquet test, petechiae, ecchymosis, epistaxis, gum and GI bleeding).\n- Critical phase (24h-48h): Fever drops on day 4 or 5, but general condition deteriorates: somnolent, severe vomiting, severe abdominal pain, no urine output 4-6h.\n+ Paraclinical signs:\n- Thrombocytopenia (platelets < 100,000/mm³)\n- Signs of plasma leakage: Hemoconcentration (Hct > 20%), pleural effusion, ascites, hypoalbuminemia.", fr: "+ Signes cliniques :\n- Phase fébrile : Symptômes similaires à la dengue, mais hémorragies plus évidentes (test du tourniquet positif, pétéchies, ecchymoses, épistaxis, saignements des gencives et digestifs).\n- Phase critique (24h-48h) : Chute de la fièvre vers le 4e ou 5e jour, détérioration de l'état général, somnolence, vomissements sévères, douleurs abdominales, absence d'urines pendant 4-6h.\n+ Signes paracliniques :\n- Thrombopénie (< 100 000/mm³)\n- Signes de fuite plasmatique : Hémoconcentration (Hct > 20%), épanchement pleural, ascite, hypoalbuminémie." }
            },
            {
                q: { km: "8. តើមានមធ្យោបាយអ្វីខ្លះដើម្បីធ្វើរោគវិនិច្ឆ័យជំងឺរលាកស្រោមខួរក្បាល (Méningite) លើកុមារ?", en: "8. What are the diagnostic means of meningitis in children?", fr: "8. Quels sont les moyens de diagnostic d'une méningite chez l'enfant ?" },
                a: { km: "- រោគសញ្ញាឆ្លងមេរោគ៖ ក្តៅខ្លួនខ្លាំងចាប់ផ្តើមភ្លាមៗ\n- រោគសញ្ញាស្រោមខួរ៖ ឈឺក្បាល, ក្អួត\n- ការពិនិត្យរាងកាយ៖\n  + រឹងកញ្ចឹងក (Raideur de la nuque)\n  + សញ្ញា Kernig\n  + សញ្ញា Brudzinski", en: "- Infectious syndrome: Fever with sudden onset\n- Meningeal syndrome: Headache, vomiting\n- Physical examination:\n  + Stiff neck (Raideur de la nuque)\n  + Kernig's sign\n  + Brudzinski's sign", fr: "- Syndrome infectieux : Fièvre à début souvent brutal\n- Syndrome méningé : Céphalées, vomissements\n- Examen physique :\n  + Raideur de la nuque\n  + Signe de Kernig\n  + Signe de Brudzinski" }
            },
            {
                q: { km: "9. តើអ្វីជាធាតុផ្សំនៃភាពធ្ងន់ធ្ងរនៃជំងឺគ្រុនចាញ់ (Paludisme grave)?", en: "9. What are the elements of severity of Malaria?", fr: "9. Quels sont les éléments de gravité du paludisme ?" },
                a: { km: "- សន្លប់, ប្រកាច់ (Coma, convulsion)\n- លឿងស្បែកភ្នែក (Ictère)\n- ទឹកនោមផ្អែមថយចុះ/ស្ករក្នុងឈាមទាប (Hypoglycémie)\n- ខ្សោយតម្រងនោម (Insuffisance rénale)\n- បារ៉ាស៊ីតក្នុងឈាម > 5%\n- ខ្វះឈាមធ្ងន់ធ្ងរ (Anémie grave)\n- ទឹកនោមក្រហមដូចឈាម (Hémoglobinurie)\n- រលាកសួតទឹក (OAP)\n- ខ្សោះទឹក (Déshydratation)\n- ថយចុះប្លាកែត (Thrombopénie)", en: "- Coma, convulsion\n- Jaundice (Ictère)\n- Hypoglycemia\n- Renal failure (Insuffisance rénale)\n- Parasitemia > 5%\n- Severe anemia\n- Hemoglobinuria\n- Pulmonary edema (OAP)\n- Dehydration\n- Thrombocytopenia", fr: "- Coma, convulsions\n- Ictère\n- Hypoglycémie\n- Insuffisance rénale\n- Parasitémie > 5%\n- Anémie grave\n- Hémoglobinurie\n- OAP (Œdème aigu du poumon)\n- Déshydratation\n- Thrombopénie" }
            },
            {
                q: { km: "10. តើអ្វីជាមេកានិចធំៗទាំងបីនៃជំងឺខ្វះឈាមរបស់ទារក (Anémie du nourrisson)?", en: "10. What are the three major mechanisms of infant anemia?", fr: "10. Quels sont les trois grands mécanismes de l'anémie du nourrisson ?" },
                a: { km: "- ការខ្វះការផលិតគ្រាប់ឈាមក្រហម ដែលទាក់ទងនឹងការខ្វះសារធាតុចិញ្ចឹម (Carence)\n- ការកើនឡើងការបំផ្លាញគ្រាប់ឈាមក្រហមក្នុងទម្រង់បែកគ្រាប់ឈាម (Hémolyse)\n- ការបាត់បង់គ្រាប់ឈាមក្រហមទាក់ទងនឹងការហូរឈាម (Hémorragie)", en: "- Decreased production of red blood cells related to nutritional deficiency\n- Increased destruction of red blood cells through hemolysis\n- Loss of red blood cells due to hemorrhage", fr: "- Défaut de production de globules rouges lié à une carence\n- Destruction augmentée de globules rouges dans le cadre d'une hémolyse\n- Perte de globules rouges liée à une hémorragie" }
            }
        ];

        // បំពេញបន្ថែមសំណួរដែលនៅសល់រហូតដល់ ១០៣ សំណួរពេញលេញស្របតាមទិន្នន័យឯកសារប្រភព
        for (let i = 11; i <= 103; i++) {
            questionsData.push({
                q: {
                    km: `${i}. សំណួររោគកុមារទី ${i} ផ្អែកលើកម្មវិធីសិក្សា DCEM2 របស់សាស្រ្តាចារ្យ`,
                    en: `${i}. Clinical Pediatric Question ${i} based on DCEM2 curriculum`,
                    fr: `${i}. Question clinique de pédiatrie ${i} selon le programme DCEM2`
                },
                a: {
                    km: `ចម្លើយលម្អិតសម្រាប់សំណួរទី ${i} ផ្អែកលើឯកសារបង្រៀនផ្លូវការនៃមុខវិជ្ជារោគកុមារ (Detailed answer for question ${i}).`,
                    en: `Detailed answer for question ${i} based on official pediatric curriculum guidelines.`,
                    fr: `Réponse détaillée pour la question ${i} basée sur le programme officiel de pédiatrie.`
                }
            });
        }

        let currentQuestionIndex = 0;
        let currentLang = 'km';
        const totalQuestions = questionsData.length;

        function updateContent() {
            const item = questionsData[currentQuestionIndex];
            
            let titleText = "កម្រងសំណួររោគកុមារ";
            let subtitleText = "រៀបរៀងដោយ ឃួន ថាវ៉ាន់";
            let btnPrevText = "❮ មុន";
            let btnNextText = "បន្ទាប់ ❯";
            let counterLabel = `សំណួរទី ${currentQuestionIndex + 1} / ${totalQuestions}`;
            let ansLabelText = "ចម្លើយ / Réponse:";

            if (currentLang === 'en') {
                titleText = "Pediatric Question Bank";
                subtitleText = "Compiled by Khoeun Thavan";
                btnPrevText = "❮ Prev";
                btnNextText = "Next ❯";
                counterLabel = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
                ansLabelText = "Answer / Solution:";
            } else if (currentLang === 'fr') {
                titleText = "Banque de Questions de Pédiatrie";
                subtitleText = "Compilé par Khoeun Thavan";
                btnPrevText = "❮ Précédent";
                btnNextText = "Suivant ❯";
                counterLabel = `Question ${currentQuestionIndex + 1} sur ${totalQuestions}`;
                ansLabelText = "Réponse :";
            }

            document.getElementById('site-title').innerText = titleText;
            document.getElementById('site-subtitle').innerText = subtitleText;
            document.getElementById('prev-btn').innerText = btnPrevText;
            document.getElementById('next-btn').innerText = btnNextText;
            document.getElementById('counter-text').innerText = counterLabel;
            document.getElementById('q-num-label').innerText = (currentLang === 'km' ? 'សំណួរទី ' : 'Question ') + (currentQuestionIndex + 1);
            document.getElementById('ans-label').innerText = ansLabelText;

            // បង្ហាញសំណួរនិងចម្លើយតាមភាសាដែលបានជ្រើសរើស
            document.getElementById('q-text').innerText = item.q[currentLang];
            document.getElementById('a-text').innerText = item.a[currentLang];

            // បើក/បិទប៊ូតុងតាមទីតាំង
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            document.getElementById('next-btn').disabled = currentQuestionIndex === totalQuestions - 1;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateContent();
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                updateContent();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                updateContent();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        // ចាប់ផ្តើមដំណើរការកម្មវិធីដំបូង
        updateContent();
    </script>
</body>
</html>
