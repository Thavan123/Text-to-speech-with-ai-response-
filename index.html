        function setLanguage(lang) {
            currentLang = lang;
            
            // Highlight active button
            ['km', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all bg-white text-indigo-700 shadow-sm";
                } else {
                    btn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50";
                }
            });

            // Update UI static texts
            const t = uiTexts[lang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('main-header-title').innerText = t.headerTitle;
            document.getElementById('main-header-subtitle').innerText = t.headerSubtitle;
            document.querySelector('[data-i18n="prev"]').innerText = t.prev;
            document.querySelector('[data-i18n="next"]').innerText = t.next;
            document.querySelector('[data-i18n="answer"]').innerText = t.answer;
            document.querySelector('[data-i18n="jumpto"]').innerText = t.jumpto;
            document.getElementById('footer-text').innerText = t.footer;

            // Refresh current question display
            displayQuestion(currentIdx);
        }

        function displayQuestion(index) {
            currentIdx = index;
            const q = questionsData[index];
            const t = uiTexts[currentLang];

            // Update question numbers
            document.getElementById('current-q-num').innerText = q.id;
            document.getElementById('total-q-num').innerText = questionsData.length;

            // Update badge and texts based on current language
            document.getElementById('question-badge').innerText = t.badge + q.id;
            document.getElementById('question-text').innerText = q[currentLang] || q.km;
            document.getElementById('answer-text').innerText = q.answer;

            // Update pagination buttons styling
            const grid = document.getElementById('pagination-grid');
            Array.from(grid.children).forEach((btn, idx) => {
                if (idx === index) {
                    btn.className = "w-8 h-8 flex items-center justify-center text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "w-8 h-8 flex items-center justify-center text-xs font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            });

            // Handle Prev/Next buttons disabled state
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === questionsData.length - 1);
        }

        function nextQuestion() {
            if (currentIdx < questionsData.length - 1) {
                displayQuestion(currentIdx + 1);
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                displayQuestion(currentIdx - 1);
            }
        }

        // Initialize Pagination Grid
        function initPagination() {
            const grid = document.getElementById('pagination-grid');
            grid.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.innerText = q.id;
                btn.onclick = () => displayQuestion(idx);
                grid.appendChild(btn);
            });
        }

        // Run initialization on load
        window.onload = () => {
            initPagination();
            displayQuestion(0);
        };
    </script>
</body>
</html>
