        function setLanguage(lang) {
            currentLang = lang;
            
            // Update button styles

                    btn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all text-indigo-100 hover:bg-indigo-600/50";
                }
            });

            // Update static UI texts
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            renderQuestion();
        }

        function renderQuestion() {
            const q = questionsData[currentIndex];
            
            // Question badge & text
            document.getElementById('question-badge').innerText = `សំណួរទី ${q.id} / Question ${q.id}`;
            
            let qText = q.km;
            if (currentLang === 'fr') qText = q.fr;
            if (currentLang === 'en') qText = q.en;
            document.getElementById('question-text').innerText = qText;

            // Answer text
            document.getElementById('answer-text').innerText = q.answer;

            // Numbers
            document.getElementById('current-q-num').innerText = q.id;
            document.getElementById('total-q-num').innerText = questionsData.length;

            // Buttons state
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questionsData.length - 1;

            // Highlight pagination grid active button
            document.querySelectorAll('.page-pill').forEach((pill, idx) => {
                if (idx === currentIndex) {
                    pill.className = "page-pill w-8 h-8 flex items-center justify-center text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
                } else {
                    pill.className = "page-pill w-8 h-8 flex items-center justify-center text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all";
                }
            });
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            const grid = document.getElementById('pagination-grid');
            questionsData.forEach((q, idx) => {

                btn.onclick = () => goToQuestion(idx);
                grid.appendChild(btn);
            });
