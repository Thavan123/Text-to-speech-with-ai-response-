        const data = [
            { id: 1, km: "តើលក្ខណៈវិនិច្ឆ័យនៃ Nephrotic syndrome មានអ្វីខ្លះ?", fr: "Quels sont les critères du diagnostic du syndrome néphrotique?", en: "What are the diagnostic criteria for nephrotic syndrome?", answer_km: "- Protéinurie dans la zone néphrotique\n- Hypoalbuminémie\n- Œdèmes\n- Hyperlipidémie", answer_fr: "- Protéinurie néphrotique\n- Hypoalbuminémie < 30 g/L\n- Œdèmes généralisés\n- Hyperlipidémie", answer_en: "- Nephrotic range proteinuria\n- Hypoalbuminemia\n- Edema\n- Hyperlipidemia" },
            { id: 2, km: "តើផលវិបាកសរសៃឈាមបេះដូងនៃការរលាកតម្រងនោមក្រោយឆ្លងមេរោគ មានអ្វីខ្លះ?", fr: "Quelles sont les complications cardiovasculaires de la glomérulonéphrite post-infectieuse?", en: "What are the cardiovascular complications of post-infectious glomerulonephritis?", answer_km: "- លើសទម្ងន់ទឹកក្នុងខ្លួន (Volume overload)\n- លើសឈាម (Hypertension)\n- កើនប៉ូតាស្យូមក្នុងឈាម (Hyperkalemia)", answer_fr: "- Surcharge volémique\n- Hypertension artérielle\n- Insuffisance cardiaque", answer_en: "- Volume overload\n- Hypertension\n- Heart failure" },
            { id: 3, km: "តើធ្វើដូចម្តេចដើម្បីធ្វើរោគវិនិច្ឆ័យជំងឺ Filariasis?", fr: "Comment diagnostiquer la filariose?", en: "How to diagnose filariasis?", answer_km: "- ប៉ារ៉ាស៊ីតពេញវ័យ: កោសល្យវិច័យកូនកណ្តុរ (Biopsie ganglionnaire)\n- មីក្រូហ្វីឡារែ: យកសំណាកឈាមពេលយប់ជ្រៅ (ប្រហែល ២៣ន ឬ ១ទៀបភ្លឺ)", answer_fr: "- Vers adultes : Biopsie ganglionnaire\n- Microfilaires : Frottis sanguin ou goutte épaisse prélevée la nuit", answer_en: "- Adult worms: Lymph node biopsy\n- Microfilaria: Night blood smear collection" },
            { id: 4, km: "តើកត្តាអ្វីខ្លះដែលចូលរួមក្នុងការពង្រីកដងខ្លួន របស់ក្មេង?", fr: "Quels sont les facteurs intervenants dans le développement somatique de l’enfant?", en: "What are the factors involved in the somatic development of the child?", answer_km: "- កត្តាហ្សែន (Genetics)\n- កត្តាហ័រម៉ូន (Hormones)\n- អាហារូបត្ថម្ភ និងបរិស្ថាន", answer_fr: "- Facteurs génétiques\n- Facteurs hormonaux\n- Nutrition et environnement", answer_en: "- Genetic factors\n- Hormonal factors\n- Nutrition and environment" },
            { id: 5, km: "តើការព្យាបាលជំងឺ Idiopathic thrombocytopenic purpura (ITP) យ៉ាងដូចម្តេច?", fr: "Quel est le traitement du purpura thrombopénique idiopathique?", en: "What is the treatment of idiopathic thrombocytopenic purpura?", answer_km: "- ប្រើថ្នាំ Prednisolone តាមផ្លូវមាត់: ២ មីលីក្រាម/គីឡូក្រាម/ថ្ងៃ រយៈពេល ១៤ថ្ងៃ\n- ឬ Methylprednisolone តាមសរសៃឈាមវែន", answer_fr: "- Corticothérapie (Prednisolone per os)\n- Immunoglobulines IV (IGIV) en cas d'urgence", answer_en: "- Oral Prednisolone\n- IV Immunoglobulins (IVIG) if severe" },
            { id: 6, km: "តើគោលការណ៍អ្វីខ្លះដែលបណ្តាលឱ្យកើតជំងឺរលាកបំពង់ខ្យល់ Epiglottitis?", fr: "Quel est le mécanisme à l'origine de l'épiglottite?", en: "What is the mechanism causing epiglottitis?", answer_km: "- ការរលាកបំពង់កផ្នែកខាងលើ និងដក់ខ្ទុះនៅ Epiglottis\n- ច្រើនបង្កឡើងដោយបាក់តេរី Hemophilus influenzae type b", answer_fr: "- Inflammation aiguë de l'épiglotte\n- Souvent due à Haemophilus influenzae b", answer_en: "- Acute inflammation of the epiglottis\n- Commonly caused by Haemophilus influenzae type b" },
            { id: 7, km: "តើទិដ្ឋភាពគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃជំងឺគ្រុនឈាមធ្ងន់ធ្ងរ មានអ្វីខ្លះ?", fr: "Quels sont les signes cliniques et paracliniques de la fièvre dengue hémorragique?", en: "What are the clinical and paraclinical signs of dengue hemorrhagic fever?", answer_km: "- ដំណាក់កាលមានគ្រុន ដំណាក់កាលវិបត្តិ និងដំណាក់កាលសះស្បើយ\n- ប្លាកែតធ្លាក់ចុះ និងការលេចធ្លាយប្លាស្មា (Hemoconcentration)", answer_fr: "- Phase fébrile, critique et de convalescence\n- Thrombopénie et fuite plasmatique", answer_en: "- Febrile, critical, and recovery phases\n- Thrombocytopenia and plasma leakage" },
            { id: 8, km: "តើមធ្យោបាយធ្វើរោគវិនិច្ឆ័យជំងឺរលាកស្រោមខួរក្បាល ចំពោះក្មេងមានអ្វីខ្លះ?", fr: "Quels sont les moyens de diagnostic d’une méningite chez l’enfant?", en: "What are the diagnostic methods for meningitis in children?", answer_km: "- រោគសញ្ញាឆ្លងមេរោគ និងរលាកស្រោមខួរ (រឹងកញ្ចឹងក, សញ្ញា Kernig, Brudzinski)\n- ការបូមទឹកខួរឆ្អឹងខ្នង (Ponction lombaire)", answer_fr: "- Syndrome infectieux et méningé (raideur de la nuque)\n- Ponction lombaire (analyse du LCR)", answer_en: "- Infectious and meningeal signs (stiff neck)\n- Lumbar puncture (CSF analysis)" },
            { id: 9, km: "តើធាតុផ្សំនៃភាពធ្ងន់ធ្ងររបស់ជំងឺគ្រុនចាញ់ មានអ្វីខ្លះ?", fr: "Quels sont les éléments de gravité du Paludisme?", en: "What are the severe elements of malaria?", answer_km: "- សន្លប់ (Coma), ប្រកាច់ (Convulsions), ឡើងលឿង (Ictère)\n- ជាតិស្ករក្នុងឈាមទាប, ខ្សោយតម្រងនោម, ខ្វះឈាមធ្ងន់ធ្ងរ", answer_fr: "- Neuropaludisme (Coma, convulsions)\n- Ictère, insuffisance rénale, anémie grave", answer_en: "- Cerebral malaria (coma, convulsions)\n- Jaundice, renal failure, severe anemia" },
            { id: 10, km: "តើយន្តការធំៗទាំងបីនៃការខ្វះឈាម ចំពោះទារកមានអ្វីខ្លះ?", fr: "Quels sont les trois grands mécanismes de l’anémie du nourrisson?", en: "What are the three major mechanisms of anemia in infants?", answer_km: "- ការថយចុះការផលិតគ្រាប់ឈាមក្រហម\n- ការបំបែកកម្ទេចគ្រាប់ឈាមក្រហមច្រើនពេក (Hémolyse)\n- ការបាត់បង់ឈាម (Hémorragie)", answer_fr: "- Défaut de production de globules rouges\n- Hémolyse (destruction excessive)\n- Pertes sanguines (hémorragie)", answer_en: "- Decreased red blood cell production\n- Hemolysis (increased destruction)\n- Blood loss" },
            { id: 11, km: "តើការខ្វះឈាមដោយសារខ្វះជាតិដែក មានការវិវត្តយ៉ាងដូចម្តេច?", fr: "Quelle est l'évolution de l'anémie ferriprive?", en: "What is the evolution of iron deficiency anemia?", answer_km: "- ដំណាក់កាលអស់បម្រុងជាតិដែកក្នុងរាងកាយ\n- ដំណាក់កាលថយចុះការបង្កើតអេម៉ូក្លូប៊ីន\n- កើតជាជំងឺខ្វះឈាមប្រភេទមីក្រូស៊ីត (Anémie microcytaire)", answer_fr: "- Épuisement des réserves en fer\n- Diminution de l'érythropoïèse\n- Installation de l'anémie microcytaire", answer_en: "- Depletion of iron stores\n- Reduced hemoglobin synthesis\n- Microcytic anemia development" },
            { id: 12, km: "តើទារកមានប្រភពជាតិដែកពីណាមកខ្លះនៅពេលកើត?", fr: "Quelles sont les sources de fer du nouveau-né à la naissance?", en: "What are the newborn's sources of iron at birth?", answer_km: "- ជាតិដែកដែលផ្ទេរមកពីម្តាយតាមរយៈรก (Placenta) ក្នុងត្រីមាសទី៣ នៃការមានផ្ទៃពោះ។", answer_fr: "- Fer transféré de la mère via le placenta pendant le troisième trimestre de la grossesse.", answer_en: "- Iron transferred from the mother via the placenta during the third trimester of pregnancy." },
            { id: 13, km: "តើគោលការណ៍ព្យាបាលជំងឺរលាកទងសួតស្រួចស្រាវ មានអ្វីខ្លះ?", fr: "Quels sont les principes du traitement de la bronchiolite aiguë?", en: "What are the principles of treatment for acute bronchiolitis?", answer_km: "- សម្អាតរន្ធច្រមុះ និងបឺតល្ហុងខ្សាយ\n- ឱ្យទឹកនិងចំណីអាហារក្នុងបរិមាណតិចតែញឹកញាប់\n- តាមដានសញ្ញាដកដង្ហើមពិបាក", answer_fr: "- Désobstruction rhinopharyngée (DRP)\n- Hydratation et alimentation fractionnées\n- Surveillance respiratoire", answer_en: "- Nasal clearing (saline drops)\n- Frequent small feeds / hydration\n- Respiratory monitoring" },
            { id: 14, km: "តើផលវិបាកអ្វីខ្លះដែលងាយកើតមានចំពោះកុមារកើតមិនគ្រប់ខែ?", fr: "Quelles sont les complications fréquentes chez le nouveau-né prématuré?", en: "What are the common complications in premature newborns?", answer_km: "- វិបត្តិដកដង្ហើម (Maladie des membranes hyalines)\n- ការហូរឈាមក្នុងខួរក្បាល\n- ការរលាកពោះវៀនដាំដុះ (Entérocolite ulcéro-nécrotique)", answer_fr: "- Détresse respiratoire (MMH)\n- Hémorragie intra-ventriculaire\n- Entérocolite ulcéro-nécrotique", answer_en: "- Respiratory distress syndrome\n- Intraventricular hemorrhage\n- Necrotizing enterocolitis" },
            { id: 15, km: "តើការកំណត់អាយុគភ៌ គិតផ្អែកលើអ្វីខ្លះ?", fr: "Sur quoi se base la détermination de l'âge gestationnel?", en: "What is the determination of gestational age based on?", answer_km: "- កាលបរិច្ឆេទថ្ងៃមករដូវចុងក្រោយ (DDR)\n- ការពិនិត្យអ៊ុលត្រាសោនក្នុងត្រីមាសទី១\n- ពិន្ទុវាយតម្លៃទារកទើបកើត (Ballard ឬ Dubowitz)", answer_fr: "- Date des dernières règles (DDR)\n- Échographie du premier trimestre\n- Score de Ballard ou Dubowitz", answer_en: "- Last menstrual period (LMP)\n- First-trimester ultrasound\n- Ballard or Dubowitz score" },
            { id: 16, km: "តើអ្វីជាមូលហេតុចម្បងនៃការឡើងលឿងចំពោះទារកទើបកើត?", fr: "Quelles sont les causes principales de l'ictère néonatal?", en: "What are the main causes of neonatal jaundice?", answer_km: "- ឡើងលឿងធម្មជាតិ (Ictère physiologique)\n- ភាពមិនស៊ីគ្នាឈាមរវាងម្តាយនិងកូន (ABO ឬ Rhésus)\n- ឡើងលឿងដោយសារទឹកដោះម្តាយ", answer_fr: "- Ictère physiologique\n- Incompatibilité fœto-maternelle ABO ou Rhésus\n- Ictère au lait de mère", answer_en: "- Physiological jaundice\n- ABO or Rh incompatibility\n- Breast milk jaundice" },
            { id: 17, km: "តើគោលការណ៍ព្យាបាលជំងឺរលាកសួតស្រួចស្រាវ លើកុមារមានអ្វីខ្លះ?", fr: "Quels sont les principes du traitement de la pneumonie aiguë chez l'enfant?", en: "What are the principles of treatment for acute pneumonia in children?", answer_km: "- ការឱ្យថ្នាំអង់ទីប៊ីយូទិកសមស្រប\n- ការផ្ដល់អុកស៊ីសែនពេលមានការធ្លាក់ចុះកម្រិតអុកស៊ីសែន\n- ការផ្តល់ជាតិទឹក និងអាហារគ្រប់គ្រាន់", answer_fr: "- Antibiothérapie adaptée\n- Oxygénothérapie si détresse\n- Hydratation et soutien nutritionnel", answer_en: "- Appropriate antibiotic therapy\n- Oxygen therapy if needed\n- Supportive care and hydration" },
            { id: 18, km: "តើอาการសំខាន់ៗនៃជំងឺខ្សោយបេះដូងលើកុមារ មានអ្វីខ្លះ?", fr: "Quels sont les principaux signes de l'insuffisance cardiaque chez l'enfant?", en: "What are the main signs of heart failure in children?", answer_km: "- ដង្ហើមញាប់ និងពិបាកដកដង្ហើម\n- បែកញើសច្រើនពេលបៅ\n- ថ្លើមធំ និងការឡើងទម្ងន់យឺតយ៉ាវ", answer_fr: "- Tachypnée et dyspnée\n- Sueurs abondantes lors des tétées\n- Hépatomégalie et cassure de la courbe de poids", answer_en: "- Tachypnea and dyspnea\n- Heavy sweating during feeds\n- Hepatomegaly and failure to thrive" },
            { id: 19, km: "តើការចាត់ថ្នាក់កម្រិតនៃការខ្សោះជាតិទឹក តាមអង្គការសុខភាពពិភពលោក មានអ្វីខ្លះ?", fr: "Quelles sont les classifications de la déshydratation selon l'OMS?", en: "What are the classifications of dehydration according to WHO?", answer_km: "- គ្មានការខ្សោះជាតិទឹក (No dehydration)\n- ការខ្សោះជាតិទឹកកម្រិតស្រាលដល់មធ្យម (Some dehydration)\n- ការខ្សោះជាតិទឹកកម្រិតធ្ងន់ធ្ងរ (Severe dehydration)", answer_fr: "- Pas de déshydratation\n- Déshydratation légère à modérée\n- Déshydratation sévère", answer_en: "- No dehydration\n- Some dehydration\n- Severe dehydration" },
            { id: 20, km: "តើការការពារជំងឺរាកស្រួចស្រាវ លើកុមារត្រូវធ្វើដូចម្តេច?", fr: "Comment prévenir la diarrhée aiguë chez l'enfant?", en: "How to prevent acute diarrhea in children?", answer_km: "- បំបៅដោះកូនផ្តាច់មុខរហូតដល់អាយុ ៦ខែ\n- ការលាងសម្អាតដៃនឹងសាប៊ូឱ្យបានញឹកញាប់\n- ប្រើប្រាស់ទឹកស្អាត និងម្ហូបអាហារមានអនាម័យ", answer_fr: "- Allaitement maternel exclusif jusqu'à 6 mois\n- Lavage fréquent des mains au savon\n- Utilisation d'eau potable et hygiène alimentaire", answer_en: "- Exclusive breastfeeding for 6 months\n- Frequent handwashing with soap\n- Safe drinking water and food hygiene" },
            { id: 21, km: "តើផលវិបាកធ្ងន់ធ្ងរបំផុតនៃការខ្សោះជាតិទឹកមានអ្វីខ្លះ?", fr: "Quelles sont les complications les plus graves de la déshydratation?", en: "What are the most severe complications of dehydration?", answer_km: "- ស្តុបបេះដូងសរសៃឈាម (Choc hypovolémique)\n- ខ្សោយតម្រងនោមស្រួចស្រាវ (Insuffisance rénale aiguë)\n- វិបត្តិអេឡិចត្រូលីតក្នុងឈាម", answer_fr: "- Choc hypovolémique\n- Insuffisance rénale aiguë\n- Troubles ioniques graves", answer_en: "- Hypovolemic shock\n- Acute kidney injury\n- Severe electrolyte imbalances" },
            { id: 22, km: "តើការវាយតម្លៃស្ថានភាពអាហារូបត្ថម្ភរបស់កុមារត្រូវប្រើសន្ទស្សន៍អ្វីខ្លះ?", fr: "Quels indices utilise-t-on pour évaluer l'état nutritionnel de l'enfant?", en: "What indices are used to assess a child's nutritional status?", answer_km: "- ទម្ងន់ធៀបនឹងអាយុ (Poids/Âge)\n- កម្ពស់ធៀបនឹងអាយុ (Taille/Âge)\n- ទម្ងន់ធៀបនឹងកម្ពស់ (Poids/Taille) និងទំហំ vòng bras", answer_fr: "- Poids pour l'âge\n- Taille pour l'âge\n- Poids pour la taille (périmètre brachial)", answer_en: "- Weight-for-age\n- Height-for-age\n- Weight-for-height (mid-upper arm circumference)" },
            { id: 23, km: "តើគោលការណ៍ណែនាំក្នុងការផ្ដល់អាហារបន្ថែម ចាប់ផ្តើមនៅអាយុប៉ុន្មាន?", fr: "À quel âge doit-on commencer la diversification alimentaire?", en: "At what age should complementary feeding start?", answer_km: "- ចាប់ផ្តើមផ្ដល់អាហារបន្ថែមក្រៅពីទឹកដោះម្តាយនៅអាយុ ៦ខែបរិបូរណ៍ ព្រមទាំងបន្តបំបៅដោះ។", answer_fr: "- Débuter la diversification alimentaire à l'âge de 6 mois révolus tout en poursuivant l'allaitement.", answer_en: "- Start complementary feeding at completed 6 months of age while continuing breastfeeding." },
            { id: 24, km: "តើការពិនិត្យទូទៅពេលដំបូងចំពោះទារកទើបកើត មានគោលដៅអ្វី?", fr: "Quel est l'objectif de l'examen clinique initial du nouveau-né?", en: "What is the objective of the initial clinical examination of the newborn?", answer_km: "- រកមើលភាពមិនប្រក្រតី ឬពិការភាពCongenital ធ្ងន់ធ្ងរ\n- វាយតម្លៃកម្រិតនៃការសម្របខ្លួនក្រោយពេលកើត", answer_fr: "- Détecter les malformations congénitales majeures\n- Évaluer l'adaptation à la vie extra-utérine", answer_en: "- Detect major congenital anomalies\n- Evaluate extrauterine adaptation" },
            { id: 25, km: "តើវ៉ាក់សាំងអ្វីខ្លះដែលត្រូវផ្តល់ឱ្យទារកភ្លាមក្រោយពេលកើតនៅកម្ពុជា?", fr: "Quels vaccins doivent être administrés au nouveau-né immédiatement après la naissance au Cambodge?", en: "What vaccines should be given to newborns immediately after birth in Cambodia?", answer_km: "- វ៉ាក់សាំងការពារជំងឺរលាកថ្លើមបេ (Hépatite B)\n- វ៉ាក់សាំងការពារជំងឺរបេង (BCG)", answer_fr: "- Vaccin contre l'hépatite B\n- Vaccin BCG (tuberculose)", answer_en: "- Hepatitis B vaccine\n- BCG vaccine (tuberculosis)" },
            { id: 26, km: "តើធ្វើដូចម្តេចដើម្បីធ្វើរោគវិនិច្ឆ័យជំងឺ pleurésie purulente?", fr: "Comment diagnostiquer la pleurésie purulente?", en: "What are the diagnostic methods for purulent pleurisy?", answer_km: "- ការថតរស្មីសួត (Radiographie pulmonaire) ឬអ៊ុលត្រាសោនសួត\n- ការបូមយកទឹកក្នុងភ្នាសសួតមកវិភាគ (Ponction pleurale)", answer_fr: "- Radiographie thoracique ou échographie\n- Ponction pleurale exploratrice", answer_en: "- Chest X-ray or ultrasound\n- Diagnostic pleural tap" },
            { id: 27, km: "តើប៉ារ៉ាម៉ែត្រនៃពិន្ទុ Apgar មានអ្វីខ្លះ?", fr: "Quels sont les paramètres du score d’Apgar?", en: "What are the parameters of the Apgar score?", answer_km: "- ចង្វាក់បេះដូង (Fréquence cardiaque)\n- ការដកដង្ហើម (Respiration)\n- សាច់ដុំ (Tonus musculaire)\n- ការឆ្លើយតបនឹងការញ៉ាក់ (Réactivité)\n- ពណ៌សម្បុរស្បែក (Coloration)", answer_fr: "- Fréquence cardiaque, Respiration, Tonus, Réactivité, Coloration", answer_en: "- Heart rate, Respiratory effort, Muscle tone, Reflex irritability, Color" },
            { id: 28, km: "តើប៉ារ៉ាម៉ែត្រនៃពិន្ទុ Silverman មានអ្វីខ្លះ?", fr: "Quels sont les paramètres du score de Silverman?", en: "What are the parameters of the Silverman score?", answer_km: "- ចលនាទ្រូងពេលដង្ហើម\n- សភាពស្ទះចន្លោះជំនី\n- ការប៉ោងស្លាបច្រមុះ\n- សំឡេងថ្ងូរពេលដកដង្ហើមចេញ", answer_fr: "- Balancement thoraco-abdominal, Tirage intercostal, Battement des ailes du nasaux, Gémissement expiratoire", answer_en: "- Chest movement, Intercostal retraction, Nasal flaring, Expiratory grunt" },
            { id: 29, km: "ចូរចាត់ថ្នាក់ការរលាកស្រោមខួរ រលាកបំពង់ក និងមេរោគរបេង។", fr: "Classer la méningite, l’angine streptococcique et Mycobacterium tuberculosis.", en: "Classify meningitis, streptococcal pharyngitis, and tuberculosis.", answer_km: "- ចាត់ថ្នាក់តាមប្រភេទភ្នាក់ងារបង្កជំងឺ (បាក់តេរី វីរុស ប៉ារ៉ាស៊ីត) និងទីតាំងរលាកក្នុងរាងកាយ។", answer_fr: "- Classification selon l'agent pathogène (bactérien, viral) et la localisation anatomique.", answer_en: "- Classification based on the pathogen type (bacterial, viral) and anatomical localization." },
            { id: 30, km: "តើការរលាកស្រោមខួរក្បាលប្រភេទណាខ្លះដែលទាក់ទងនឹងដំបៅលលាដ៍ក្បាល?", fr: "Quelles méningites sont associées à des lésions crâniennes?", en: "Which meningitis cases are associated with cranial lesions?", answer_km: "- ការរលាកស្រោមខួរក្បាលប្រភេទបាក់តេរី បន្ទាប់ពីមានការប៉ះទង្គិច ឬបាក់លលាដ៍ក្បាលធ្ងន់ធ្ងរ។", answer_fr: "- Méningites bactériennes secondaires à une fracture du crâne ou à un traumatisme crânien.", answer_en: "- Bacterial meningitis secondary to skull fracture or severe head trauma." },
            { id: 31, km: "រោគវិនិច្ឆ័យចំពោះ méningite lymphocytaire រួមនឹង transaminases ខ្ពស់ និងខ្សោយតម្រងនោម។", fr: "Méningite lymphocytaire associée à une élévation des transaminases et insuffisance rénale.", en: "Lymphocytic meningitis with elevated transaminases and renal failure.", answer_km: "- ត្រូវគិតដល់ជំងឺ Leptospirosis ឬការឆ្លងមេរោគវីរុសស៊ីស្ទីមផ្សេងទៀត។", answer_fr: "- Évoquer une leptospirose ou certaines arboviroses systémiques.", answer_en: "- Consider leptospirosis or certain systemic arboviral infections." },
            { id: 32, km: "ការឱ្យថ្នាំផ្សះប្រឆាំងមេនីងកុកជាបន្ទាន់នៅផ្ទះ។", fr: "Antibiothérapie parentérale anti-méningococcique au domicile.", en: "Parenteral anti-meningococcal antibiotics at home.", answer_km: "- ផ្តល់ជូនក្នុងករណីមានការសង្ស័យខ្លាំងលើជំងឺរលាកខួរក្បាលដោយមេនីងកុក ឬ Purpura fulminans មុនបញ្ជូន។", answer_fr: "- En cas de suspicion forte de purpura fulminans avant le transfert hospitalier.", answer_en: "- In case of strong suspicion of purpura fulminans prior to hospital transfer." },
            { id: 33, km: "ថ្នាំផ្សះសរសៃឈាមវែនសម្រាប់ méningite purulente ឃើញ coccs gram négatif។", fr: "ATB IV pour méningite purulente avec coccs gram négatif.", en: "IV antibiotics for purulent meningitis with gram-negative cocci.", answer_km: "- ប្រើប្រាស់ថ្នាំ Cefotaxime ឬ Ceftriaxone តាមសរសៃឈាមវែន។", answer_fr: "- Utilisation de Céfotaxime ou Ceftriaxone par voie IV.", answer_en: "- Use of IV Cefotaxime or Ceftriaxone." },
            { id: 34, km: "តើមូលហេតុអ្វីខ្លះធ្វើឱ្យទារកកើតខ្សោយអាហារូបត្ថម្ភធ្ងន់ធ្ងរ?", fr: "Quelles sont les causes de la MPE chez l'enfant?", en: "What are the causes of PEM in infants?", answer_km: "- ការខ្វះខាតប្រូតេអ៊ីន ថាមពល (កាឡូរី) វីតាមីន និងសារធាតុរ៉ែក្នុងរយៈពេលយូរ។", answer_fr: "- Carence prolongée en protéines, en énergie (calories) et en micronutriments.", answer_en: "- Prolonged deficiency in proteins, energy (calories), and micronutrients." },
            { id: 35, km: "សញ្ញាបែងចែករវាង Marasme និង Kwashiorkor។", fr: "Signes distinctifs entre le marasme et le kwashiorkor.", en: "Distinguishing signs between marasme and kwashiorkor.", answer_km: "- Marasme: ស្គមស្គាំងខ្លាំង គ្មានក្រហើមទឹក ចង់ស៊ីចំណីខ្លាំង\n- Kwashiorkor: មានដុំពកហើមទឹក (Edema), មុខមូលហើម, បាត់បង់ចំណង់អាហារ", answer_fr: "- Marasme : Maigreur extrême, absence d'œdèmes, appétit conservé\n- Kwashiorkor : Présence d'œdèmes, visage lunaire, anorexie", answer_en: "- Marasme: Severe wasting, no edema, good appetite\n- Kwashiorkor: Presence of edema, moon face, loss of appetite" },
            { id: 36, km: "វិធីសាស្ត្រការពារជំងឺ Marasme និង Kwashiorkor។", fr: "Méthodes de prévention du marasme et du kwashiorkor.", en: "Prevention methods for marasme and kwashiorkor.", answer_km: "- ការពង្រឹងការបំបៅដោះកូន\n- ការផ្តល់អាហារបន្ថែមគ្រប់គ្រងជីវជាតិ\n- ការចាក់វ៉ាក់សាំង និងអប់រំសុខភាពដល់ម្តាយ", answer_fr: "- Promotion de l'allaitement maternel\n- Diversification alimentaire adéquate\n- Vaccination et éducation nutritionnelle", answer_en: "- Promotion of breastfeeding\n- Adequate complementary feeding\n- Immunization and nutrition education" },
            { id: 37, km: "ទំនាក់ទំនងរវាងការរលាកសរសៃទឹកនោម និង SHU។", fr: "Liens entre l'infection urinaire et le SHU.", en: "Links between urinary tract infection and HUS.", answer_km: "- ភាគច្រើនបង្កឡើងដោយបាក់តេរី E. coli ផលិតសារធាតុពុល ដែលនាំឱ្យខូចកោសិកាតម្រងនោម។", answer_fr: "- Souvent lié à des infections à E. coli producteurs de shigatoxines entraînant des lésions rénales.", answer_en: "- Often linked to Shiga toxin-producing E. coli infections leading to kidney damage." },
            { id: 38, km: "សញ្ញាគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃគ្រុនឈាមរាកហូរឈាម។", fr: "Signes cliniques et paracliniques de la DHF.", en: "Clinical and paraclinical signs of DHF.", answer_km: "- គ្រុនក្តៅខ្លាំងភ្លាមៗ, សញ្ញាហូរឈាម, ប្លាកែតធ្លាក់ចុះក្រោម ១០០,០០០/មម៣ និងដង់ស៊ីតេឈាមឡើងខ្ពស់។", answer_fr: "- Fièvre élevée, manifestations hémorragiques, thrombopénie < 100 000/mm³ et hémoconcentration.", answer_en: "- High fever, hemorrhagic manifestations, thrombocytopenia < 100,000/mm³, and hemoconcentration." },
            { id: 39, km: "និយមន័យនៃ Idiopathic Thrombocytopenia Purpura (ITP)។", fr: "Définition du purpura thrombopénique idiopathique.", en: "Definition of ITP.", answer_km: "- ជាការធ្លាក់ចុះចំនួនប្លាកែតក្នុងឈាមដោយឯកឯង បណ្តាលមកពីប្រព័ន្ធភាពស៊ាំបំផ្លាញប្លាកែតខ្លួនឯង។", answer_fr: "- Baisse isolée des plaquettes sanguines due à une destruction immune périphérique.", answer_en: "- Isolated decrease in blood platelets caused by immune-mediated destruction." },
            { id: 40, km: "ក្មេងគ្រុនឈាមធ្ងន់ធ្ងរមានសភាពស្រុតបេះដូងសរសៃឈាម អត់ទឹកនោម ៤ម៉ោង តែឈាមរត់ល្អ តើត្រូវធ្វើម៉េច?", fr: "Surveillance de la diurèse et choc de la dengue.", en: "Dengue shock and urine output monitoring.", answer_km: "- បន្តតាមដានតុល្យភាពជាតិទឹកបន្តទៀត វាយតម្លៃមុខងារតម្រងនោម និងពិនិត្យមើលសញ្ញាសំខាន់ៗជាប្រចាំ។", answer_fr: "- Poursuivre la surveillance stricte de la diurèse, des paramètres hémodynamiques et de l'état d'hydratation.", answer_en: "- Continue strict monitoring of urine output, hemodynamic parameters, and hydration status." },
            { id: 41, km: "សញ្ញាគ្លីនិកនៃ Lymphatic filariasis។", fr: "Manifestations cliniques de la filariose lymphatique.", en: "Clinical manifestations of lymphatic filariasis.", answer_km: "- រលាកកូនកណ្តុរ និងរលាកសរសៃទឹកនោមខ្សឹបស្រួចស្រាវ, ការឡើងដំរីរ៉ាំរ៉ៃ (Lymphœdème/Éléphantiasis)", answer_fr: "- Lymphangites aiguës, adénolymphites, et lymphœdème chronique (éléphantiasis)", answer_en: "- Acute adenolymphangitis, chronic lymphedema (elephantiasis)" },
            { id: 42, km: "ចំណុចសំខាន់ពេលពិនិត្យស្បែក និងប្រព័ន្ធរំលាយអាហារទារកទើបកើត។", fr: "Examen cutané et digestif du nouveau-né.", en: "Skin and digestive examination of the newborn.", answer_km: "- ពិនិត្យស្នាមអុច ឬកន្ទួលស្បែកធម្មតា, ពិនិត្យទំហំពោះ និងការធ្លាក់លាមកដំបូង (Méconium)", answer_fr: "- Inspection de la peau (ictère, lésions), examen de l'abdomen et vérification de l'émission du méconium.", answer_en: "- Skin inspection (jaundice, rashes), abdominal examination, and check for meconium passage." },
            { id: 43, km: "មេរោគបង្កជំងឺរលាកស្រោមខួរមានខ្ទុះចំពោះកុមារ និងទារក។", fr: "Germes responsables de méningite purulente chez l'enfant.", en: "Germs responsible for purulent meningitis in children.", answer_km: "- Streptococcus pneumoniae (Pneumocoque)\n- Neisseria meningitidis (Méningocoque)\n- Haemophilus influenzae", answer_fr: "- Pneumocoque, Méningocoque, Haemophilus influenzae", answer_en: "- Streptococcus pneumoniae, Neisseria meningitidis, Haemophilus influenzae" },
            { id: 44, km: "ភាពខុសគ្នារវាងការរលាកសរសៃទឹកនោមប្រភេទ Infection Haute និង Basse។", fr: "Différence entre infection urinaire haute et basse.", en: "Difference between upper and lower UTI.", answer_km: "- Haute (Pyélonéphrite): មានគ្រុនក្តៅខ្លាំង ឈឺចង្កេះ\n- Basse (Cystite): ពិបាកនោម ក្រហាយ នោមញាប់ គ្មានគ្រុនក្តៅ", answer_fr: "- Haute (Pyélonéphrite) : Fièvre, douleurs lombaires\n- Basse (Cystite) : Brûlures mictionnelles, pollakiurie, absence de fièvre", answer_en: "- Upper (Pyelonephritis): Fever, flank pain\n- Lower (Cystitis): Dysuria, frequency, no fever" },
            { id: 45, km: "សញ្ញាគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃជំងឺរបេង ចំពោះក្មេង។", fr: "Signes cliniques et paracliniques de la tuberculose chez l'enfant.", en: "Clinical and paraclinical signs of TB in children.", answer_km: "- ក្អកាំរ៉ៃ, គ្រុនក្តៅរ៉ាំរ៉ៃពេលរសៀល, ធ្លាក់ទម្ងន់ ឬខስកម្ពស់\n- រស្មីសួតមានដុំ ឬរូបភាពរលាកកូនកណ្តុរា", answer_fr: "- Toux chronique, fièvre vespérale, altération de l'état général, radiographie thoracique anormale.", answer_en: "- Chronic cough, evening fever, failure to thrive, abnormal chest X-ray." },
            { id: 46, km: "សញ្ញាគ្លីនិក និងប៉ារ៉ាគ្លីនិកនៃជំងឺទឹកក្នុងភ្នាសសួតមានខ្ទុះ។", fr: "Signes cliniques et paracliniques de la pleurésie purulente.", en: "Clinical and paraclinical signs of purulent pleurisy.", answer_km: "- គ្រុនក្តៅខ្លាំង, ឈឺទ្រូងពេលដង្ហើមចូល, ពិបាកដកដង្ហើម\n- រស្មីសួតឃើញបាត់បង់សលាកទឹកក្នុងភ្នាសសួត", answer_fr: "- Fièvre, douleur thoracique, dyspnée, opacité pleurale à la radiographie.", answer_en: "- Fever, chest pain, dyspnea, pleural opacity on X-ray." },
            { id: 47, km: "សរសេរមូលហេតុទាំង៥ ដែលធ្វើឱ្យមានលើសសម្ពាធឈាម intracranial ក្នុងខួរក្បាល", fr: "Quelles sont les 5 causes d'hypertension intracrânienne ?", en: "What are the 5 causes of intracranial pressure?", answer_km: "- ដុំសាច់ក្នុងខួរក្បាល (Tumeurs/Masses expansives)\n- ទឹកក្នុងខួរក្បាល (Hydrocéphalies)\n- ការរលាកស្រោមខួរក្បាល\n- ការប៉ះទង្គិចក្បាលធ្ងន់ធ្ងរ\n- របួសសរសៃឈាមខួរក្បាល", answer_fr: "- Masses expansives (tumeurs, abcès)\n- Hydrocéphalie\n- Œdème cérébral\n- Thrombose veineuse cérébrale\n- Méningite/Encéphalite", answer_en: "- Space-occupying lesions (tumors, abscesses)\n- Hydrocephalus\n- Cerebral edema\n- Cerebral venous sinus thrombosis\n- Meningitis/Encephalitis" },
            { id: 48, km: "ចូររៀបរាប់ Facteurs de risques របស់ Coqueluche.", fr: "Quels sont les facteurs de risques de la coqueluche ?", en: "What are the risk factors for pertussis?", answer_km: "- កុមារមិនទាន់បានចាក់វ៉ាក់សាំងការពារជំងឺខាន់ស្លាក់-តឹងសួត-អសកម្ម\n- ការប៉ះពាល់ផ្ទាល់ជាមួយអ្នកជំងឺមានផ្ទុកមេរោគខ្យូស", answer_fr: "- Enfant non vacciné ou incomplètement vacciné\n- Contact étroit avec un sujet infecté", answer_en: "- Unvaccinated or incompletely vaccinated child\n- Close contact with an infected person" },
            { id: 49, km: "ចូររៀបរាប់អំពី Complication នៅក្នុង Néphrotique Syndrome", fr: "Quelles sont les complications du syndrome néphrotique ?", en: "What are the complications of Nephrotic Syndrome?", answer_km: "- ការធ្លាក់ចុះបរិមាណឈាមរត់ (Hypovolémie)\n- ការកកឈាមក្នុងសរសៃឈាម (Thrombosis)\n- ការឆ្លងមេរោគបាក់តេរីងាយកើតមាន", answer_fr: "- Hypovolémie\n- Complications thromboemboliques (thromboses)\n- Infections bactériennes graves", answer_en: "- Hypovolemia\n- Thromboembolic events (thrombosis)\n- Severe bacterial infections" },
            { id: 50, km: "Quels sont les signes de gravités à considérée pour une bronchiolite ?", fr: "Quels sont les signes de gravité à considérer pour une bronchiolite ?", en: "What are the signs of severity for bronchiolitis?", answer_km: "- ការផ្លាស់ប្តូរស្ថានភាពទូទៅ (AEG)\n- ការឈប់ដកដង្ហើមជាបណ្តោះអាសន្ន (Apnée) និងខៀវខ្លួន\n- អត្រាដង្ហើមលើសពី ៦០ដងក្នុង១នាទី", answer_fr: "- Altération de l'état général\n- Apnées, cyanose\n- Fréquence respiratoire > 60/min, tirage sévère", answer_en: "- Altered general condition\n- Apnea, cyanosis\n- Respiratory rate > 60/min, severe retractions" },
            { id: 51, km: "Clinical manifestation of measles", fr: "Manifestations cliniques de la rougeole", en: "Clinical manifestations of measles", answer_km: "- រយៈពេល incubation: ៨-១២ថ្ងៃ\n- ដំណាក់កាលកាតាលី: គ្រុនក្តៅល្មម, រលាកភ្នាសភ្នែក (Conjonctivite), ក្អក, និងមានប្រទាលស Koplik", answer_fr: "- Incubation de 8 à 12 jours\n- Phase prodromique : Fièvre modérée, conjonctivite, toux, taches de Koplik", answer_en: "- Incubation period: 8-12 days\n- Prodromal phase: Moderate fever, conjunctivitis, cough, Koplik spots" },
            { id: 52, km: "Différenciez l'ictère physiologique et pathologique ?", fr: "Différenciez l'ictère physiologique et pathologique ?", en: "Differentiate physiological and pathological jaundice?", answer_km: "- Physiologique: កើតលើទារកគ្រប់ខែ គ្មានសញ្ញារោគសញ្ញាផ្សេងទៀត\n- Pathologique: លឿងលឿនពេក (ថ្ងៃដំបូង), អូសបន្លាយយូរ, មានបញ្ហាសុខភាពរួមផ្សំ", answer_fr: "- Physiologique : Apparition après 24-48h, isolé, transitoire\n- Pathologique : Précoce (< 24h), prolongé, associé à d'autres signes", answer_en: "- Physiological: Appears after 24-48h, isolated, transient\n- Pathological: Early onset (< 24h), prolonged, associated with other signs" },
            { id: 53, km: "Décrire les moyens de diagnostic de méningite chez grands enfants.", fr: "Décrire les moyens de diagnostic de la méningite chez les grands enfants.", en: "Describe the diagnostic means of meningitis in older children.", answer_km: "- រកមើលរោគសញ្ញាឆ្លងមេរោគ និងរលាកស្រោមខួរក្បាល (រឹងកញ្ចឹងក)\n- ការធ្វើពិន្ទុទឹកខួរឆ្អឹងខ្នងតាមរយៈការបូម (Ponction lombaire)", answer_fr: "- Mise en évidence du syndrome infectieux et méningé (raideur de la nuque)\n- Ponction lombaire avec analyse cytologique et biochimique", answer_en: "- Identification of infectious and meningeal syndrome (stiff neck)\n- Lumbar puncture with cerebrospinal fluid analysis" },
            { id: 54, km: "តើអ្វីជាភាពខុសគ្នារវាងទម្រង់គ្លីនិកនៃ Syndrome Hémolytique et Urémique (SHU)?", fr: "Quels sont les différents entre les formes cliniques du SHU ?", en: "What are the differences between the clinical forms of HUS?", answer_km: "- ទម្រង់ធម្មតា (Forme Typique): មានរាករូស, ខ្វះឈាម, ធ្លាក់ប្លាកែត និងខ្សោយតម្រងនោម\n- ទម្រង់មិនធម្មតា (Forme Atypique): គ្មានប្រវត្តិរាករូសទេ", answer_fr: "- Forme Typique : Précédée de diarrhée (liée aux Shiga-toxines)\n- Forme Atypique : Sans diarrhée, souvent d'origine génétique", answer_en: "- Typical form: Preceded by diarrhea (Shiga toxin-associated)\n- Atypical form: Without diarrhea, often genetic" },
            { id: 55, km: "Données les signes Clinique de laryngite sus glottique.", fr: "Quels sont les signes cliniques de la laryngite sus-glottique ?", en: "What are the clinical signs of supraglottic laryngitis?", answer_km: "- គ្រុនក្តៅខ្លាំង, ពិបាកដកដង្ហើមមានសំឡេងស្រួយ (Dyspnée laryngée), និងពិបាកលេបអាហារឬទឹក (Dysphagie)", answer_fr: "- Fièvre élevée, dyspnée inspiratoire avec stridor, dysphagie (salivation abondante)", answer_en: "- High fever, inspiratory dyspnea with stridor, dysphagia (drooling)" },
            { id: 56, km: "Le prise en charge de prématuré", fr: "La prise en charge du prématuré", en: "Management of the premature infant", answer_km: "- មុនពេលសម្រាល: ឱ្យថ្នាំ corticosteroids ដល់ម្តាយ\n- ពេលសម្រាល: ការពារកម្តៅរាងកាយទារកឱ្យបានល្អ (Réchauffer)", answer_fr: "- Prénatale : Corticothérapie maternelle\n- À la naissance : Maintien de la température (chaîne du chaud), réanimation si besoin", answer_en: "- Antenatal: Maternal corticosteroid therapy\n- At birth: Thermal control (warm chain), resuscitation if needed" },
            { id: 57, km: "Les germes responsables de méningite purulente sont :", fr: "Quels sont les germes responsables de méningite purulente ?", en: "What are the germs responsible for purulent meningitis?", answer_km: "- មេរោគបាក់តេរីដូចជា: Méningocoque, Pneumocoque និង Haemophilus", answer_fr: "- Principalement le Méningocoque, le Pneumocoque et Haemophilus influenzae", answer_en: "- Primarily Meningococcus, Pneumococcus, and Haemophilus influenzae" },
            { id: 58, km: "Des éléments de gravité du paludisme :", fr: "Quels sont les éléments de gravité du paludisme ?", en: "What are the elements of severity of malaria?", answer_km: "- សន្លប់ (Coma), ប្រកាច់ (Convulsions), ឡើងលឿង (Ictère), ស្ករក្នុងឈាមទាប (Hypoglycémie)", answer_fr: "- Coma, convulsions, ictère, hypoglycémie, anémie sévère, insuffisance rénale", answer_en: "- Coma, convulsions, jaundice, hypoglycemia, severe anemia, renal failure" },
            { id: 59, km: "ដំណាក់កាលឆ្លងមេរោគអេដស៍ពីម្តាយទៅកូនបើគ្មានវិធានការការពារ៖", fr: "Période de transmission du VIH de la mère à l'enfant :", en: "Period of HIV transmission from mother to child:", answer_km: "- ក្នុងពេលមានផ្ទៃពោះ (In utero)\n- ក្នុងពេលសម្រាល (Pendant l'accouchement)\n- ក្រោយពេលសម្រាលតាមរយៈការបំបៅដោះកូន (Allaitement)", answer_fr: "- In utero (pendant la grossesse)\n- Per-partum (lors de l'accouchement)\n- Post-partum (par l'allaitement maternel)", answer_en: "- In utero (during pregnancy)\n- Intrapartum (during delivery)\n- Postpartum (via breastfeeding)" },
            { id: 60, km: "Le diagnostic du syndrome néphrotique :", fr: "Quels sont les critères de diagnostic du syndrome néphrotique ?", answer_fr: "Quels sont les critères de diagnostic du syndrome néphrotique ?", en: "What is the diagnosis of nephrotic syndrome?", answer_km: "- កម្រិតប្រូតេអ៊ីនក្នុងទឹកនោមលើសពី ៣ក្រាមក្នុងមួយថ្ងៃ\n- ជាតិអាល់ប៊ុយមីនក្នុងឈាមទាបជាង ៣០ក្រាម/លីត្រ", answer_fr: "- Protéinurie > 3 g/24h\n- Hypoalbuminémie < 30 g/L\n- Œdèmes", answer_en: "- Proteinuria > 3g/24h\n- Hypoalbuminemia < 30g/L\n- Edema" },
            { id: 61, km: "La classification broncho pneumonie ?", fr: "Quelle est la classification de la broncho-pneumonie ?", en: "What is the classification of bronchopneumonia?", answer_km: "- កម្រិតទី១: ស្រាល (Stade I léger)\n- កម្រិតទី២: មធ្យម (Stade II modéré)\n- កម្រិតទី៣: ធ្ងន់ធ្ងរ (Stade III sévère)", answer_fr: "- Stade I : Léger\n- Stade II : Modéré\n- Stade III : Sévère", answer_en: "- Stage I: Mild\n- Stage II: Moderate\n- Stage III: Severe" },
            { id: 62, km: "Guillain-Barré syndrome : signs, symptoms, diagnosis, treatment", fr: "Syndrome de Guillain-Barré : signes, symptômes, diagnostic, traitement", en: "Guillain-Barré syndrome: signs, symptoms, diagnosis, treatment", answer_km: "- រោគសញ្ញា: ខ្សោយសាច់ដុំស៊ីសង្វាក់គ្នាទាំងសងខាង\n- រោគវិនិច្ឆ័យ: ការពិនិត្យទឹកខួរឆ្អឹងខ្នង និងអគ្គិសនីសាច់ដុំ (EMG)", answer_fr: "- Signes : Paralysie flasque ascendante symétrique\n- Diagnostic : Ponction lombaire (dissociation albumino-cytologique), EMG", answer_en: "- Signs: Symmetrical ascending flaccid paralysis\n- Diagnosis: Lumbar puncture, EMG" },
            { id: 63, km: "តើគោលការណ៍សំខាន់ៗក្នុងការថែទាំទារកទើបកើតមានអ្វីខ្លះ?", fr: "Quels sont les principes essentiels des soins aux nouveau-nés?", en: "What are the essential principles of newborn care?", answer_km: "- រក្សាកំដៅរាងកាយទារកឱ្យបានល្អ\n- ការពារកុំឱ្យមានការឆ្លងមេរោគផ្សេងៗ\n- ជំរុញការបំបៅដោះកូនដោយទឹកដោះម្តាយ", answer_fr: "- Maintien de la température corporelle\n- Prévention des infections\n- Promotion de l'initiation précoce de l'allaitement", answer_en: "- Maintaining body temperature\n- Preventing infections\n- Promoting early breastfeeding" }
        ];

        let currentIndex = 0;
        let currentLang = 'km';

        function updateUI() {
            const item = data[currentIndex];
            const t = uiText[currentLang];
            
            // Update general UI text
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-author').innerText = t.author;
            document.getElementById('lbl-ans').innerText = t.ansLabel;
            document.getElementById('btn-prev').innerText = t.prev;
            document.getElementById('btn-next').innerText = t.next;
            document.getElementById('ui-grid-title').innerText = t.gridTitle;

            // Question content based on selected language
            document.getElementById('q-number').innerText = t.qPrefix + (currentIndex + 1);
            document.getElementById('q-content').innerText = item[currentLang] || item.km;

            // Answer content based on selected language
            let ansKey = 'answer_' + currentLang;
            document.getElementById('ans-content').innerText = item[ansKey] || item.answer_km || item.answer;

            document.getElementById('q-position').innerText = (currentIndex + 1) + ' / ' + data.length;

            // Buttons state
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === data.length - 1;

            // Language buttons styling
            ['km', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById('l-' + l);
                if (l === currentLang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Grid buttons creation/styling
            const grid = document.getElementById('jumpGrid');
            if (grid.children.length === 0) {
                for (let i = 0; i < data.length; i++) {
                    const b = document.createElement('button');
                    b.className = 'grid-btn';
                    b.id = 'g-btn-' + i;
                    b.innerText = i + 1;
                    b.onclick = () => goTo(i);
                    grid.appendChild(b);
                }
            }

            for (let i = 0; i < data.length; i++) {
                const gb = document.getElementById('g-btn-' + i);
                if (gb) {
                    if (i === currentIndex) {
                        gb.classList.add('active');
                    } else {
                        gb.classList.remove('active');
                    }
                }
            }
        }

        function nextQ() {
            if (currentIndex < data.length - 1) {
                currentIndex++;
                updateUI();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function prevQ() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function goTo(index) {
            currentIndex = index;
            updateUI();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function setLang(lang) {
            currentLang = lang;
            updateUI();
        }

        // Initialize on load
        updateUI();
    </script>

</html>
