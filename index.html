<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កម្រងសំណួររោគកុមារ - ឃួន ថាវ៉ាន់</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kantumruy Pro', sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 650px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      color: #1e3a8a;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    /* Custom Language Buttons */
    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .lang-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .content-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-bottom: 20px;
      min-height: 260px;
    }
    .meta-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .q-badge {
      background: #dbeafe;
      color: #1d4ed8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .question {
      font-weight: 700;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .answer {
      color: #334155;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      border-top: 1px dashed #cbd5e1;
      padding-top: 12px;
    }
    .nav-buttons {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-prev {
      background: #e2e8f0;
      color: #475569;
    }
    .btn-next {
      background: #2563eb;
      color: white;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1 id="title-text">កម្រងសំណួររោគកុមារ</h1>
    <p id="author-text">រៀបចំដោយ៖ ឃួន ថាវ៉ាន់</p>
  </div>

  <!-- Language Switcher Buttons -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="changeLanguage('km')">🇰🇭 ភាសាខ្មែរ</button>
    <button class="lang-btn" onclick="changeLanguage('fr')">🇫🇷 Français</button>
    <button class="lang-btn" onclick="changeLanguage('en')">🇬🇧 English</button>
  </div>

  <div class="content-box">
    <div class="meta-info">
      <span class="q-badge" id="q-count">សំណួរទី 1 / 103</span>
    </div>
    <div class="question" id="q-text">កំពុងផ្ទុក...</div>
    <div class="answer" id="a-text">កំពុងផ្ទុក...</div>
  </div>

  <div class="nav-buttons">
    <button class="btn btn-prev" id="btn-prev" onclick="prevQ()">⬅ ថយក្រោយ</button>
    <button class="btn btn-next" id="btn-next" onclick="nextQ()">បន្ទាប់ ➡</button>
  </div>
</div>

<script>
let currentLang = 'km';
let currentIndex = 0;

// Text translations for UI Elements
const uiTranslations = {
  km: {
    title: "កម្រងសំណួររោគកុមារ",
    author: "រៀបចំដោយ៖ ឃួន ថាវ៉ាន់",
    qPrefix: "សំណួរទី",
    prevBtn: "⬅ ថយក្រោយ",
    nextBtn: "បន្ទាប់ ➡"
  },
  fr: {
    title: "Questionnaire de Pédiatrie",
    author: "Préparé par : Khoun Thavan",
    qPrefix: "Question",
    prevBtn: "⬅ Précédent",
    nextBtn: "Suivant ➡"
  },
  en: {
    title: "Pediatric Question Bank",
    author: "Prepared by: Khoun Thavan",
    qPrefix: "Question",
    prevBtn: "⬅ Previous",
    nextBtn: "Next ➡"
  }
};

// Data array containing translations for questions
const questions = [
  {
    id: 1,
    km: {
      q: "1. លក្ខណៈវិនិច្ឆ័យនៃរោគសញ្ញាស៊ីនដ្រូមណេហ្វ្រូទិក (Syndrome néphrotique)?",
      a: "- វត្តមានប្រូតេអ៊ីនក្នុងទឹកនោមខ្ពស់ (Protéinurie > 50mg/kg/24h)\n- អាល់ប៊ុយមីនក្នុងឈាមទាប (Hypoalbuminémie < 30g/L)\n- ការហើម (Œdème)\n- ជីពចរលីពីដឡើងខ្ពស់ (Hyperlipidémie)"
    },
    fr: {
      q: "1. Critères diagnostiques du syndrome néphrotique?",
      a: "- Protéinurie abondante (> 50 mg/kg/j)\n- Hypoalbuminémie (< 30 g/L)\n- Œdèmes\n- Hyperlipidémie"
    },
    en: {
      q: "1. Diagnostic criteria for nephrotic syndrome?",
      a: "- Nephrotic range proteinuria (> 50 mg/kg/day)\n- Hypoalbuminemia (< 30 g/L)\n- Edema\n- Hyperlipidemia"
    }
  },
  {
    id: 12,
    km: {
      q: "12. ការធ្វើរោគវិនិច្ឆ័យ និងការពិនិត្យមន្ទីរពិសោធន៍នៃជំងឺក្អកមាន់ (Coqueluche)?",
      a: "រោគវិនិច្ឆ័យ៖\n- ដំណាក់កាលដំបូង៖ ក្អក, ចង់ក្អួត, ក្អកយប់, គ្រុនក្តៅល្មម (37.5°C-38°C)\n- ដំណាក់កាលក្អកខ្លាំង (7 ទៅ 10 ថ្ងៃ)៖ ស្បែកខៀវ (Cyanose)\n- ដំណាក់កាលថយចុះនៃដំណាក់កាលក្អក\n\nការពិនិត្យមន្ទីរពិសោធន៍៖\n+ តេស្ត ELISA រកអង់ទីករ anti-Bordetella pertussis\n+ Hyperlymphocytose (គ្រាប់ឈាមស 10,000 ដល់ 30,000 ដោយមាន Lym 60-90%)\n+ អ៊ិចស្ត្រេឆ្អឹងជំនី (X-ray)៖ ជួនកាលឃើញមាន Atélectasie"
    },
    fr: {
      q: "12. Diagnostic et examen de laboratoire de la coqueluche?",
      a: "Diagnostic:\n- Période de début: toux, émétisante, nocturne, Fièvre modérée (37,5°c-38°c)\n- Période des quintes (7 à 10 jours), cyanose.\n- Phase de déclin des quintes.\nExamen de laboratoire:\n+ Test Elisa anti corps anti - Bordetella pertussis\n+ Hyperlymphocytose (10 000 à 30 000 Leucocytes dont 60 à 90% de lymphocytes).\n+ Radiographie du thorax: parfois atélectasie."
    },
    en: {
      q: "12. Diagnosis and laboratory examination of whooping cough (Pertussis)?",
      a: "Diagnosis:\n- Onset period: cough, emetic, nocturnal, moderate fever (37.5°C-38°C)\n- Paroxysmal period (7 to 10 days), cyanosis.\n- Waning phase of paroxysms.\nLaboratory examination:\n+ ELISA test for anti-Bordetella pertussis antibodies\n+ Lymphocytosis (10,000 to 30,000 leukocytes with 60 to 90% lymphocytes)\n+ Chest X-ray: sometimes atelectasis."
    }
  }
  // អ្នកអាចបន្ថែមសំណួរផ្សេងៗទៀតតាមទម្រង់ structured Object នេះបានយ៉ាងងាយស្រួល!
];

function updateCard() {
  const item = questions[currentIndex] || questions[0];
  const ui = uiTranslations[currentLang];
  
  // Update Header UI
  document.getElementById('title-text').innerText = ui.title;
  document.getElementById('author-text').innerText = ui.author;
  document.getElementById('btn-prev').innerText = ui.prevBtn;
  document.getElementById('btn-next').innerText = ui.nextBtn;
  
  // Update Question Content
  document.getElementById('q-count').innerText = `${ui.qPrefix} ${currentIndex + 1} / ${questions.length}`;
  document.getElementById('q-text').innerText = item[currentLang].q;
  document.getElementById('a-text').innerText = item[currentLang].a;

  // Buttons status
  document.getElementById('btn-prev').disabled = (currentIndex === 0);
  document.getElementById('btn-next').disabled = (currentIndex === questions.length - 1);
}

function changeLanguage(lang) {
  currentLang = lang;
  
  // Update active button status
  const buttons = document.querySelectorAll('.lang-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  
  if(lang === 'km') buttons[0].classList.add('active');
  if(lang === 'fr') buttons[1].classList.add('active');
  if(lang === 'en') buttons[2].classList.add('active');
  
  updateCard();
}

function nextQ() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    updateCard();
  }
}

function prevQ() {
  if (currentIndex > 0) {
    currentIndex--;
    updateCard();
  }
}

// Initial Run
updateCard();
</script>

</body>
</html>
