<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pediatric Questions Viewer</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f5f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Card */
.card {
  width: 600px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  position: relative;
}

/* Question text */
.question {
  font-size: 20px;
  line-height: 1.6;
  margin-bottom: 20px;
}

/* Buttons */
.controls {
  display: flex;
  justify-content: space-between;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #4a6cf7;
  color: white;
  font-size: 14px;
}

button:hover {
  background: #364fc7;
}

/* Language switch */
.lang {
  position: absolute;
  top: 10px;
  right: 10px;
}

select {
  padding: 5px;
}
</style>

</head>
<body>

<div class="card">
  <div class="lang">
    <select id="language">
      <option value="km">Khmer</option>
      <option value="en">English</option>
      <option value="fr">French</option>
    </select>
  </div>

  <div id="question" class="question"></div>

  <div class="controls">
    <button onclick="prev()">⬅ Prev</button>
    <button onclick="next()">Next ➡</button>
  </div>
</div>

<script>

// ===== QUESTIONS (extract from your PDF) =====
const questions = [
  {
    km: "រៀបរាប់ Syndrome Hémolytique et Urémique",
    en: "Describe Hemolytic Uremic Syndrome",
    fr: "Décrire le syndrome hémolytique et urémique"
  },
  {
    km: "រៀបរាប់ clinical 2 formes របស់ SHU",
    en: "Describe the 2 clinical forms of HUS",
    fr: "Décrire les deux formes cliniques du SHU"
  },
  {
    km: "រៀបរាប់ signes clinique de laryngite sus glottique",
    en: "Describe clinical signs of supraglottic laryngitis",
    fr: "Signes cliniques de la laryngite sus-glottique"
  },
  {
    km: "ការថែទាំ prématuré (anténatal, naissance, post-natal)",
    en: "Management of premature baby",
    fr: "Prise en charge du prématuré"
  },
  {
    km: "មេរោគបង្ក meningite purulente",
    en: "Causative germs of purulent meningitis",
    fr: "Germes responsables de méningite purulente"
  },
  {
    km: "ធាតុធ្ងន់ធ្ងរ paludisme",
    en: "Severity criteria of malaria",
    fr: "Éléments de gravité du paludisme"
  },
  {
    km: "ការផ្ទេរ HIV ម្តាយទៅកូន",
    en: "Mother-to-child HIV transmission",
    fr: "Transmission du VIH mère-enfant"
  },
  {
    km: "Diagnosis syndrome néphrotique",
    en: "Diagnosis of nephrotic syndrome",
    fr: "Diagnostic du syndrome néphrotique"
  }
];

let index = 0;

// Display function
function showQuestion() {
  let lang = document.getElementById("language").value;
  document.getElementById("question").innerText = questions[index][lang];
}

// Next
function next() {
  if (index < questions.length - 1) {
    index++;
    showQuestion();
  }
}

// Previous
function prev() {
  if (index > 0) {
    index--;
    showQuestion();
  }
}

// Language change
document.getElementById("language").addEventListener("change", showQuestion);

// Init
showQuestion();

</script>

</body>
  </html>
